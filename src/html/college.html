<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#071c18">
  <title>Skip MDM · 监管分析报告</title>
  <style>
    :root {
      --night: #071c18;
      --ink: #102821;
      --muted: #65756f;
      --paper: #f1eee5;
      --card: rgba(255,255,255,.76);
      --line: rgba(16,40,33,.13);
      --green: #0b7253;
      --lime: #d9f36d;
      --orange: #f17047;
      --red: #b43a30;
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(circle at 92% 4%, rgba(217,243,109,.45), transparent 25rem),
        radial-gradient(circle at 0 58%, rgba(241,112,71,.12), transparent 28rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 20px 0 0; }
    .nav { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .home-link, .private { min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid rgba(255,255,255,.58); border-radius: 13px; background: rgba(255,255,255,.62); box-shadow: 0 8px 24px rgba(8,28,24,.08); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .home-link { color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 800; }
    .home-link:hover { background: rgba(255,255,255,.88); }
    .private { color: var(--muted); font: 700 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; }
    .hero { padding: 34px 0 24px; }
    .eyebrow { margin-bottom: 12px; color: var(--green); font-size: 11px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 850px; margin: 0; font-size: clamp(38px, 6vw, 58px); line-height: 1; letter-spacing: -.055em; }
    .lead { max-width: 720px; margin: 17px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px; margin: 18px 0 28px; }
    .metric { min-height: 84px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    .metric.success { color: white; background: var(--green); border-color: transparent; }
    .metric.alert { color: white; background: var(--orange); border-color: transparent; }
    .metric-label { display: block; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .metric.success .metric-label, .metric.alert .metric-label { color: rgba(255,255,255,.72); }
    .metric-value { display: block; margin-top: 10px; font-size: 24px; line-height: 1.15; font-weight: 880; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .toolbar { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 0 18px; }
    .toolbar h2 { margin: 0; font-size: 28px; letter-spacing: -.035em; }
    .toolbar p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .reanalyze { flex: 0 0 auto; border: 0; border-radius: 12px; padding: 11px 16px; color: white; background: var(--green); cursor: pointer; font-weight: 800; }
    .reanalyze:disabled { cursor: wait; opacity: .58; }
    .management-detail { margin: 0 0 30px; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
    .management-detail h2 { margin: 0 0 6px; font-size: 25px; letter-spacing: -.035em; }
    .management-detail > p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 26px; }
    .detail-row { min-width: 0; display: grid; grid-template-columns: minmax(145px, .9fr) minmax(0, 1.1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
    .detail-label { color: var(--muted); font-size: 13px; }
    .detail-value { font-size: 13px; font-weight: 750; overflow-wrap: anywhere; }
    .finding-list { display: grid; gap: 12px; padding-bottom: 64px; }
    .finding { padding: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: 0 16px 40px rgba(8,28,24,.05); }
    .finding.apple { border-color: rgba(180,58,48,.3); background: rgba(255,244,239,.84); }
    .finding-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .finding h3 { margin: 0; font-size: 23px; letter-spacing: -.03em; }
    .company { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .badge { padding: 7px 9px; border-radius: 999px; background: rgba(11,114,83,.09); color: var(--green); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .badge.system { color: var(--red); background: rgba(180,58,48,.09); }
    .warning { margin: 18px 0 0; padding: 13px 15px; border-radius: 12px; color: #7f2b24; background: rgba(241,112,71,.12); font-size: 13px; line-height: 1.6; }
    .normal-note { margin: 18px 0 0; padding: 13px 15px; border-radius: 12px; color: #075c43; background: rgba(11,114,83,.1); font-size: 13px; line-height: 1.6; }
    .health-warning { margin: 0 0 28px; padding: 20px 22px; border: 1px solid rgba(180,58,48,.3); border-radius: 18px; color: #7f2b24; background: rgba(255,244,239,.9); }
    .health-warning h2 { margin: 0 0 8px; font-size: 22px; }
    .health-warning p { margin: 0; font-size: 14px; line-height: 1.65; }
    .health-hosts { margin: 12px 0 0; padding-left: 20px; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    details { margin-top: 18px; border-top: 1px solid var(--line); }
    summary { padding: 17px 0 0; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 750; }
    .evidence { margin: 13px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
    .evidence li { padding: 10px 12px; border-radius: 10px; background: rgba(7,28,24,.055); font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .command-box { margin-top: 18px; overflow: hidden; border-radius: 15px; background: var(--night); }
    .command-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 13px 0 16px; color: rgba(255,255,255,.58); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .copy { border: 1px solid rgba(255,255,255,.18); border-radius: 9px; padding: 7px 10px; color: white; background: rgba(255,255,255,.08); cursor: pointer; font-size: 11px; font-weight: 750; }
    pre { margin: 0; padding: 14px 16px 18px; color: #efffd0; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .state { margin: 28px 0; padding: 30px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); background: var(--card); text-align: center; line-height: 1.65; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 15px); padding: 11px 15px; border-radius: 11px; color: white; background: var(--night); opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    footer { padding: 0 0 34px; color: var(--muted); font-size: 12px; }
    @media (max-width: 720px) {
      header { padding-top: 12px; }
      .nav { align-items: flex-end; flex-direction: column; }
      .private { min-height: 34px; }
      .hero { padding-top: 24px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { min-height: 82px; padding: 13px 14px; }
      .metric-value { font-size: 20px; }
      .detail-grid { grid-template-columns: 1fr; }
      .finding-head, .toolbar { align-items: flex-start; flex-direction: column; }
      .badges { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <span class="private">私密报告 · 到期失效</span>
      <a class="home-link" href="/">← 返回首页</a>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Skip MDM · Analysis report</div>
      <h1>监管分析报告</h1>
      <p class="lead">根据设备主动提交的管理组件元数据生成。报告只提供判断依据和手动命令，不会自动修改设备。</p>
    </section>
    <div id="content"><div class="state">正在读取分析结果…</div></div>
  </main>
  <footer class="wrap">报告链接不公开索引，并会在到期后失效。</footer>
  <div class="toast" id="toast" role="status" aria-live="polite">命令已复制</div>
  <script>
    const content = document.getElementById('content');
    const toast = document.getElementById('toast');

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const area = element('textarea');
        area.value = value;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.focus();
        area.select();
        area.setSelectionRange(0, area.value.length);
        let copied = false;
        try { copied = document.execCommand('copy'); } catch { copied = false; }
        area.remove();
        if (!copied) {
          window.prompt('复制失败，请手动复制：', value);
          return;
        }
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function metric(label, value, tone = '') {
      const card = element('article', `metric${tone ? ` ${tone}` : ''}`);
      card.append(element('span', 'metric-label', label), element('strong', 'metric-value', String(value)));
      return card;
    }

    function statusTone(value) {
      return ['yes', 'present', 'user_approved'].includes(value) ? 'alert' : '';
    }

    function statusText(value) {
      const labels = {
        user_approved: '是（用户批准）', yes: '是', no: '否', present: '存在',
        absent: '不存在', available: '可用', unavailable: '命令不可用', error: '检测失败', unknown: '无法确认'
      };
      return labels[value] || value || '无法确认';
    }

    function badgeText(value) {
      const labels = {
        apple: 'Apple 系统', mdm: 'MDM', rmm: '远程运维', internal: '企业内部',
        inventory: '资产清单', security: '终端安全', network: '网络接入', remote: '远程控制',
        system: '系统级', high: '高可信', medium: '中可信', low: '低可信'
      };
      return labels[value] || value;
    }

    function renderManagementDetail(management) {
      const section = element('section', 'management-detail');
      section.append(
        element('h2', '', '云配置信息'),
        element('p', '', '展示设备本地云配置记录中已提取的字段；完整 URL、证书和 plist 内容不会上传。')
      );
      const fields = [
        ['ConfigurationURL（仅主机名）', management.cloudConfigDomain || '未读取到'],
        ['云配置记录', statusText(management.cloudConfigRecord)],
        ['云配置描述文件', statusText(management.cloudConfigProfileInstalled)]
      ];
      const grid = element('div', 'detail-grid');
      for (const field of fields) {
        const row = element('div', 'detail-row');
        row.append(element('span', 'detail-label', field[0]), element('strong', 'detail-value', field[1]));
        grid.append(row);
      }
      section.append(grid);
      return section;
    }

    function renderHealthWarning(health) {
      if (!health || health.status !== 'unhealthy' || !Array.isArray(health.unexpectedAppleHostOverrides) || health.unexpectedAppleHostOverrides.length === 0) return null;
      const section = element('section', 'health-warning');
      section.append(
        element('h2', '', '系统不健康'),
        element('p', '', '/etc/hosts 中存在非预期的 Apple 服务域名覆盖，部分 Apple 服务可能不可用。请核对以下域名：')
      );
      const list = element('ul', 'health-hosts');
      for (const hostname of health.unexpectedAppleHostOverrides) list.append(element('li', '', hostname));
      section.append(list);
      return section;
    }

    function renderFinding(finding) {
      const card = element('article', `finding ${finding.category === 'apple' ? 'apple' : ''}`);
      const head = element('div', 'finding-head');
      const title = element('div');
      title.append(element('h3', '', finding.product), element('p', 'company', finding.company));
      const badges = element('div', 'badges');
      badges.append(element('span', `badge ${finding.category === 'apple' ? 'system' : ''}`, badgeText(finding.category)));
      badges.append(element('span', 'badge', badgeText(finding.confidence)));
      if (finding.states && finding.states.running) badges.append(element('span', 'badge', '正在运行'));
      if (finding.states && finding.states.persistent) badges.append(element('span', 'badge', '已持久化'));
      head.append(title, badges);
      card.append(head);

      if (finding.assessment === 'normal_system_component') {
        card.append(element('p', 'normal-note', '这是 macOS 正常的系统管理组件，存在属于正常现象，无需担心。禁止删除系统文件。'));
      } else if (finding.category === 'apple') {
        card.append(element('p', 'warning', '这是 Apple 原生系统组件。它的存在不等于设备已注册 MDM，禁止删除系统文件。'));
      } else if (!finding.removable) {
        card.append(element('p', 'warning', '当前只有运行态、注册记录或其他只读证据，报告不会据此生成删除命令。'));
      }

      const details = element('details');
      const summary = element('summary', '', `查看 ${finding.evidence.length} 条证据`);
      const list = element('ul', 'evidence');
      for (const item of finding.evidence) {
        const values = [item.type, item.path, item.label, item.program, item.bundleId, item.teamId, item.signingId, item.packageId, item.status, item.detail].filter(Boolean);
        list.append(element('li', '', values.join(' · ')));
      }
      details.append(summary, list);
      card.append(details);

      if (finding.commands.length > 0) {
        const box = element('div', 'command-box');
        const boxHead = element('div', 'command-head');
        const commands = finding.commands.join('\n');
        const button = element('button', 'copy', '复制命令');
        button.type = 'button';
        button.addEventListener('click', () => copyText(commands));
        boxHead.append(element('span', '', 'Manual removal'), button);
        box.append(boxHead, element('pre', '', commands));
        card.append(box);
      }
      return card;
    }

    function render(payload) {
      const report = payload.report;
      const management = report.source.management || {};
      const healthWarning = renderHealthWarning(report.source.health);
      content.textContent = '';
      const summary = element('section', 'summary');
      summary.append(
        metric('采集项目', report.source.itemCount),
        metric('发现组件', report.summary.findingCount),
        metric('可处理项', report.summary.removableCount, report.summary.removableCount > 0 ? 'success' : ''),
        metric('MDM 注册', statusText(management.mdmEnrollment), statusTone(management.mdmEnrollment)),
        metric('ADE/DEP', statusText(management.automatedEnrollment), statusTone(management.automatedEnrollment)),
        metric('云配置记录', statusText(management.cloudConfigRecord), statusTone(management.cloudConfigRecord)),
        metric('运行进程', management.runningProcessCount || 0)
      );
      const toolbar = element('div', 'toolbar');
      const heading = element('div');
      heading.append(element('h2', '', '组件与处理建议'), element('p', '', `报告到期：${new Date(payload.expires_at).toLocaleString()}`));
      const reanalyzeButton = element('button', 'reanalyze', '重新分析');
      reanalyzeButton.type = 'button';
      reanalyzeButton.addEventListener('click', () => reanalyze(reanalyzeButton));
      toolbar.append(heading, reanalyzeButton);
      const list = element('section', 'finding-list');
      if (report.findings.length === 0) list.append(element('div', 'state', '没有匹配到当前规则库中的监管组件。'));
      for (const finding of report.findings) list.append(renderFinding(finding));
      content.append(summary);
      if (healthWarning) content.append(healthWarning);
      content.append(renderManagementDetail(management), toolbar, list);
    }

    async function reanalyze(button) {
      button.disabled = true;
      button.textContent = '正在重新分析…';
      const id = location.pathname.split('/').filter(Boolean).pop();
      try {
        const response = await fetch(`/api/college/${encodeURIComponent(id)}/reanalyze`, {
          method: 'POST',
          headers: { Accept: 'application/json' }
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'reanalyze_failed');
        render(payload);
      } catch (error) {
        button.disabled = false;
        button.textContent = '重新分析';
        window.alert(error.message === 'report_source_unavailable' ? '原始扫描数据不可用，无法重新分析。' : '重新分析失败，请稍后重试。');
      }
    }

    async function loadReport(polling = false) {
      const id = location.pathname.split('/').filter(Boolean).pop();
      try {
        const response = await fetch(`/api/college/${encodeURIComponent(id)}`, {
          headers: { Accept: 'application/json' }
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'load_failed');
        if (payload.status === 'pending') {
          content.textContent = '';
          content.append(element('div', 'state', '报告已创建，正在等待设备完成扫描和上传…'));
          setTimeout(() => loadReport(true), 3000);
          return;
        }
        render(payload);
      } catch (error) {
        if (polling) {
          content.textContent = '';
          content.append(element('div', 'state', '报告暂时无法读取，请刷新页面后重试。'));
        } else {
          content.textContent = '';
          content.append(element('div', 'state', error.message === 'report_not_found' ? '报告不存在或已经过期。' : '暂时无法读取报告，请稍后重试。'));
        }
      }
    }

    loadReport();
  </script>
</body>
</html>
