<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#071c18">
  <title>XR MDM · 监管分析报告</title>
  <style>
    :root {
      --night: #071c18;
      --ink: #102821;
      --muted: #65756f;
      --paper: #f1eee5;
      --card: rgba(255,255,255,.76);
      --line: rgba(16,40,33,.13);
      --green: #0b7253;
      --lime: #d9f36d;
      --orange: #f17047;
      --red: #b43a30;
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 92% 4%, rgba(217,243,109,.45), transparent 25rem),
        radial-gradient(circle at 0 58%, rgba(241,112,71,.12), transparent 28rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 26px 0; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 850; }
    .mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: white; background: var(--night); font-size: 12px; }
    .private { color: var(--muted); font: 700 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
    .hero { padding: 54px 0 40px; }
    .eyebrow { margin-bottom: 18px; color: var(--green); font-size: 12px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 850px; margin: 0; font-size: clamp(44px, 7vw, 80px); line-height: .98; letter-spacing: -.06em; }
    .lead { max-width: 700px; margin: 24px 0 0; color: var(--muted); font-size: 17px; line-height: 1.75; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 38px 0 50px; }
    .metric { min-height: 145px; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
    .metric:nth-child(2) { color: white; background: var(--green); border-color: transparent; }
    .metric-label { display: block; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .metric:nth-child(2) .metric-label { color: rgba(255,255,255,.65); }
    .metric-value { display: block; margin-top: 22px; font-size: 42px; font-weight: 880; letter-spacing: -.05em; }
    .toolbar { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 0 18px; }
    .toolbar h2 { margin: 0; font-size: 28px; letter-spacing: -.035em; }
    .toolbar p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .finding-list { display: grid; gap: 14px; padding-bottom: 80px; }
    .finding { padding: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: 0 16px 40px rgba(8,28,24,.05); }
    .finding.apple { border-color: rgba(180,58,48,.3); background: rgba(255,244,239,.84); }
    .finding-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .finding h3 { margin: 0; font-size: 23px; letter-spacing: -.03em; }
    .company { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .badge { padding: 7px 9px; border-radius: 999px; background: rgba(11,114,83,.09); color: var(--green); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .badge.system { color: var(--red); background: rgba(180,58,48,.09); }
    .warning { margin: 18px 0 0; padding: 13px 15px; border-radius: 12px; color: #7f2b24; background: rgba(241,112,71,.12); font-size: 13px; line-height: 1.6; }
    details { margin-top: 18px; border-top: 1px solid var(--line); }
    summary { padding: 17px 0 0; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 750; }
    .evidence { margin: 13px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
    .evidence li { padding: 10px 12px; border-radius: 10px; background: rgba(7,28,24,.055); font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .command-box { margin-top: 18px; overflow: hidden; border-radius: 15px; background: var(--night); }
    .command-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 13px 0 16px; color: rgba(255,255,255,.58); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .copy { border: 1px solid rgba(255,255,255,.18); border-radius: 9px; padding: 7px 10px; color: white; background: rgba(255,255,255,.08); cursor: pointer; font-size: 11px; font-weight: 750; }
    pre { margin: 0; padding: 14px 16px 18px; color: #efffd0; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .state { margin: 40px 0; padding: 32px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); background: var(--card); }
    .unlock { max-width: 520px; margin: 20px 0 80px; padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
    .unlock h2 { margin: 0; font-size: 26px; letter-spacing: -.035em; }
    .unlock p { margin: 10px 0 20px; color: var(--muted); line-height: 1.65; }
    .unlock-row { display: flex; gap: 9px; }
    .unlock input { min-width: 0; flex: 1; height: 50px; padding: 0 15px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: rgba(255,255,255,.78); font: 700 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .16em; outline: none; }
    .unlock input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(11,114,83,.1); }
    .unlock button { min-width: 110px; border: 0; border-radius: 12px; color: var(--night); background: var(--lime); cursor: pointer; font-weight: 850; }
    .unlock-error { min-height: 20px; margin: 12px 0 0 !important; color: var(--red) !important; font-size: 13px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 15px); padding: 11px 15px; border-radius: 11px; color: white; background: var(--night); opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    footer { padding: 0 0 34px; color: var(--muted); font-size: 12px; }
    @media (max-width: 720px) {
      .summary { grid-template-columns: 1fr; }
      .metric { min-height: 115px; }
      .finding-head, .toolbar { align-items: flex-start; flex-direction: column; }
      .badges { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="/"><span class="mark">XR</span><span>XR MDM</span></a>
      <span class="private">PRIVATE · EXPIRING REPORT</span>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Management footprint analysis</div>
      <h1>监管组件<br>分析报告</h1>
      <p class="lead">基于 Launch plist、应用标识、代码签名、系统扩展和安装收据生成。命令不会自动执行；请核对证据并优先使用厂商卸载器。</p>
    </section>
    <div id="content"><div class="state">正在读取分析结果…</div></div>
  </main>
  <footer class="wrap">报告链接不公开索引，并会在到期后失效。</footer>
  <div class="toast" id="toast" role="status" aria-live="polite">命令已复制</div>
  <script>
    const content = document.getElementById('content');
    const toast = document.getElementById('toast');

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const area = element('textarea');
        area.value = value;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.focus();
        area.select();
        area.setSelectionRange(0, area.value.length);
        let copied = false;
        try { copied = document.execCommand('copy'); } catch { copied = false; }
        area.remove();
        if (!copied) {
          window.prompt('复制失败，请手动复制：', value);
          return;
        }
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function metric(label, value) {
      const card = element('article', 'metric');
      card.append(element('span', 'metric-label', label), element('strong', 'metric-value', String(value)));
      return card;
    }

    function renderFinding(finding) {
      const card = element('article', `finding ${finding.category === 'apple' ? 'apple' : ''}`);
      const head = element('div', 'finding-head');
      const title = element('div');
      title.append(element('h3', '', finding.product), element('p', 'company', finding.company));
      const badges = element('div', 'badges');
      badges.append(element('span', `badge ${finding.confidence === 'system' ? 'system' : ''}`, finding.category));
      badges.append(element('span', 'badge', finding.confidence));
      head.append(title, badges);
      card.append(head);

      if (!finding.removable) {
        card.append(element('p', 'warning', '这是 Apple 原生系统组件。它的存在不等于设备已注册 MDM，禁止删除系统文件。'));
      }

      const details = element('details');
      const summary = element('summary', '', `查看 ${finding.evidence.length} 条证据`);
      const list = element('ul', 'evidence');
      for (const item of finding.evidence) {
        const values = [item.type, item.path, item.label, item.bundleId, item.teamId, item.packageId].filter(Boolean);
        list.append(element('li', '', values.join(' · ')));
      }
      details.append(summary, list);
      card.append(details);

      if (finding.commands.length > 0) {
        const box = element('div', 'command-box');
        const boxHead = element('div', 'command-head');
        const commands = finding.commands.join('\n');
        const button = element('button', 'copy', '复制命令');
        button.type = 'button';
        button.addEventListener('click', () => copyText(commands));
        boxHead.append(element('span', '', 'Manual removal'), button);
        box.append(boxHead, element('pre', '', commands));
        card.append(box);
      }
      return card;
    }

    function render(payload) {
      const report = payload.report;
      content.textContent = '';
      const summary = element('section', 'summary');
      summary.append(
        metric('采集项目', report.source.itemCount),
        metric('可疑组件', report.summary.findingCount),
        metric('可处理项', report.summary.removableCount)
      );
      const toolbar = element('div', 'toolbar');
      const heading = element('div');
      heading.append(element('h2', '', '发现的管理足迹'), element('p', '', `报告到期：${new Date(payload.expires_at).toLocaleString()}`));
      toolbar.append(heading);
      const list = element('section', 'finding-list');
      if (report.findings.length === 0) list.append(element('div', 'state', '没有匹配到当前规则库中的监管组件。'));
      for (const finding of report.findings) list.append(renderFinding(finding));
      content.append(summary, toolbar, list);
    }

    function renderUnlock(message = '') {
      content.textContent = '';
      const card = element('section', 'unlock');
      card.append(element('h2', '', '输入报告密码'), element('p', '', '请输入采集脚本在终端显示的 6 位密码。'));
      const form = element('form', 'unlock-row');
      const input = element('input');
      input.type = 'password';
      input.inputMode = 'numeric';
      input.autocomplete = 'one-time-code';
      input.maxLength = 6;
      input.pattern = '[0-9]{6}';
      input.required = true;
      input.setAttribute('aria-label', '6 位报告密码');
      const button = element('button', '', '查看报告');
      button.type = 'submit';
      const error = element('p', 'unlock-error', message);
      form.append(input, button);
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        unlock(input.value.trim());
      });
      card.append(form, error);
      content.append(card);
      input.focus();
    }

    async function unlock(password, polling = false) {
      const id = location.pathname.split('/').filter(Boolean).pop();
      try {
        const response = await fetch(`/api/college/${encodeURIComponent(id)}/unlock`, {
          method: 'POST',
          headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'load_failed');
        if (payload.status === 'pending') {
          content.textContent = '';
          content.append(element('div', 'state', '报告已创建，正在等待设备完成扫描和上传…'));
          setTimeout(() => unlock(password, true), 3000);
          return;
        }
        render(payload);
      } catch (error) {
        if (polling) {
          content.textContent = '';
          content.append(element('div', 'state', '报告暂时无法读取，请刷新页面后重试。'));
        } else {
          renderUnlock(error.message === 'invalid_report_password' ? '密码错误，或报告已经过期。' : '暂时无法读取报告，请稍后重试。');
        }
      }
    }

    const parameterPassword = new URLSearchParams(location.search).get('password');
    if (/^\d{6}$/.test(parameterPassword || '')) {
      history.replaceState({}, '', location.pathname);
      unlock(parameterPassword);
    } else {
      renderUnlock();
    }
  </script>
</body>
</html>
