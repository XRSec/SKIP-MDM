<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#071c18">
  <title>Skip MDM · 监管分析报告</title>
  <style>
    :root {
      --night: #071c18;
      --ink: #102821;
      --muted: #65756f;
      --paper: #f1eee5;
      --card: rgba(255,255,255,.76);
      --line: rgba(16,40,33,.13);
      --green: #0b7253;
      --lime: #d9f36d;
      --orange: #f17047;
      --red: #b43a30;
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(circle at 92% 4%, rgba(217,243,109,.45), transparent 25rem),
        radial-gradient(circle at 0 58%, rgba(241,112,71,.12), transparent 28rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 20px 0 0; }
    .nav { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .home-link, .private { min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid rgba(255,255,255,.58); border-radius: 13px; background: rgba(255,255,255,.62); box-shadow: 0 8px 24px rgba(8,28,24,.08); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .home-link { color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 800; }
    .home-link:hover { background: rgba(255,255,255,.88); }
    .private { color: var(--muted); font: 700 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; }
    .hero { padding: 34px 0 24px; }
    .eyebrow { margin-bottom: 12px; color: var(--green); font-size: 11px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 850px; margin: 0; font-size: clamp(38px, 6vw, 58px); line-height: 1; letter-spacing: -.055em; }
    .lead { max-width: 720px; margin: 17px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px; margin: 18px 0 28px; }
    .metric { min-height: 84px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    .metric.success { color: white; background: var(--green); border-color: transparent; }
    .metric.alert { color: white; background: var(--orange); border-color: transparent; }
    .metric-label { display: block; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .metric.success .metric-label, .metric.alert .metric-label { color: rgba(255,255,255,.72); }
    .metric-value { display: block; margin-top: 10px; font-size: 24px; line-height: 1.15; font-weight: 880; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .toolbar { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 0 18px; }
    .toolbar h2 { margin: 0; font-size: 28px; letter-spacing: -.035em; }
    .toolbar p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .reanalyze { flex: 0 0 auto; border: 0; border-radius: 12px; padding: 11px 16px; color: white; background: var(--green); cursor: pointer; font-weight: 800; }
    .reanalyze:disabled { cursor: wait; opacity: .58; }
    .management-detail { margin: 0 0 30px; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
    .management-detail h2 { margin: 0 0 6px; font-size: 25px; letter-spacing: -.035em; }
    .management-detail > p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 26px; }
    .detail-row { min-width: 0; display: grid; grid-template-columns: minmax(145px, .9fr) minmax(0, 1.1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
    .detail-label { color: var(--muted); font-size: 13px; }
    .detail-value { font-size: 13px; font-weight: 750; overflow-wrap: anywhere; }
    .finding-list { display: grid; gap: 12px; padding-bottom: 64px; }
    .finding { padding: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: 0 16px 40px rgba(8,28,24,.05); }
    .finding.apple { border-color: rgba(180,58,48,.3); background: rgba(255,244,239,.84); }
    .finding-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .finding h3 { margin: 0; font-size: 23px; letter-spacing: -.03em; }
    .company { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .badge { padding: 7px 9px; border-radius: 999px; background: rgba(11,114,83,.09); color: var(--green); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .badge.system { color: var(--red); background: rgba(180,58,48,.09); }
    .warning { margin: 18px 0 0; padding: 13px 15px; border-radius: 12px; color: #7f2b24; background: rgba(241,112,71,.12); font-size: 13px; line-height: 1.6; }
    .normal-note { margin: 18px 0 0; padding: 13px 15px; border-radius: 12px; color: #075c43; background: rgba(11,114,83,.1); font-size: 13px; line-height: 1.6; }
    .health-warning { margin: 0 0 28px; padding: 20px 22px; border: 1px solid rgba(180,58,48,.3); border-radius: 18px; color: #7f2b24; background: rgba(255,244,239,.9); }
    .health-warning h2 { margin: 0 0 8px; font-size: 22px; }
    .health-warning p { margin: 0; font-size: 14px; line-height: 1.65; }
    .health-hosts { margin: 12px 0 0; padding-left: 20px; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .health-shield { margin: 0 0 24px; padding: 16px 20px; border: 1px solid rgba(11,114,83,.25); border-radius: 16px; color: #075c43; background: rgba(240,253,244,.9); display: flex; flex-direction: column; gap: 6px; }
    .health-shield h3 { margin: 0; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .health-shield p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink); }
    .health-shield-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .health-shield-tag { padding: 3px 8px; border-radius: 6px; background: rgba(11,114,83,.12); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; color: #075c43; }
    .health-notice { margin: 0 0 24px; padding: 16px 20px; border: 1px solid var(--line); border-radius: 16px; color: var(--muted); background: rgba(7,28,24,.03); display: flex; flex-direction: column; gap: 6px; }
    .health-notice h3 { margin: 0; font-size: 14.5px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; }
    .health-notice p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink); }
    details { margin-top: 18px; border-top: 1px solid var(--line); }
    summary { padding: 17px 0 0; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 750; }
    .evidence { margin: 13px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
    .evidence li { padding: 10px 12px; border-radius: 10px; background: rgba(7,28,24,.055); font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .command-box { margin-top: 18px; overflow: hidden; border-radius: 15px; background: var(--night); }
    .command-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 13px 0 16px; color: rgba(255,255,255,.58); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .copy { border: 1px solid rgba(255,255,255,.18); border-radius: 9px; padding: 7px 10px; color: white; background: rgba(255,255,255,.08); cursor: pointer; font-size: 11px; font-weight: 750; }
    pre { margin: 0; padding: 14px 16px 18px; color: #efffd0; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .state { margin: 28px 0; padding: 30px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); background: var(--card); text-align: center; line-height: 1.65; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 15px); padding: 11px 15px; border-radius: 11px; color: white; background: var(--night); opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }


    /* Cloud Enrollment Configuration Card */
    .management-wrapper { margin: 0 0 30px; }
    .enrollment-config-card { margin: 0 0 30px; padding: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: 0 16px 40px rgba(8,28,24,.05); }
    .enrollment-config-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .enrollment-config-header h2 { margin: 0; font-size: 25px; letter-spacing: -.035em; }
    .enrollment-config-header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .config-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .config-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .config-pill.alert { background: rgba(241,112,71,.14); color: #9c2e12; border: 1px solid rgba(241,112,71,.3); }
    .config-pill.success { background: rgba(11,114,83,.1); color: var(--green); border: 1px solid rgba(11,114,83,.25); }
    .config-pill.neutral { background: rgba(7,28,24,.05); color: var(--muted); border: 1px solid var(--line); }

    .config-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 20px; }
    .config-group { padding: 18px 20px; border-radius: 16px; background: rgba(255,255,255,.65); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
    .config-group.full-width { grid-column: 1 / -1; }
    .config-group-title { font-size: 13.5px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .config-kv-list { display: grid; gap: 9px; min-width: 0; }
    .config-kv-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; min-width: 0; }
    .config-kv-label { color: var(--muted); flex: 0 0 auto; font-size: 12.5px; }
    .config-kv-value { font-weight: 700; color: var(--ink); text-align: right; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .config-kv-value.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .config-kv-value.truncate a { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .config-kv-value a { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
    .config-link-wrap { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; min-width: 0; max-width: 75%; }
    .config-copy-btn { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; background: white; font-size: 11px; cursor: pointer; color: var(--muted); font-weight: 750; }
    .config-copy-btn:hover { color: var(--ink); border-color: var(--ink); }

    .skip-setup-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .skip-setup-tag { display: inline-block; padding: 4px 10px; border-radius: 8px; background: rgba(7,28,24,.05); border: 1px solid rgba(7,28,24,.08); font-size: 12px; font-weight: 600; color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .raw-config-details { margin-top: 14px; border-top: 1px solid var(--line); }
    .raw-config-summary { padding: 14px 0 0; cursor: pointer; font-size: 13px; font-weight: 800; color: var(--green); display: flex; align-items: center; justify-content: space-between; }
    .raw-config-pre-wrap { position: relative; margin-top: 12px; border-radius: 14px; overflow: hidden; background: var(--night); }
    .raw-config-pre-wrap pre { padding: 16px; font-size: 12px; line-height: 1.6; max-height: 400px; overflow-y: auto; color: #efffd0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .raw-config-copy-btn { position: absolute; top: 12px; right: 12px; padding: 6px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(255,255,255,.1); color: white; font-size: 11.5px; font-weight: 750; cursor: pointer; }
    .raw-config-copy-btn:hover { background: rgba(255,255,255,.2); }

    .paste-config-box { margin-top: 16px; padding: 16px; border-radius: 12px; background: rgba(7,28,24,.03); border: 1px dashed var(--line); }
    .paste-config-textarea { width: 100%; min-height: 110px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; outline: none; background: white; resize: vertical; box-sizing: border-box; }
    .paste-config-textarea:focus { border-color: var(--green); }
    .paste-config-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    footer { padding: 0 0 34px; color: var(--muted); font-size: 12px; }
    @media (max-width: 720px) {
      header { padding-top: 12px; }
      .nav { align-items: flex-end; flex-direction: column; }
      .private { min-height: 34px; }
      .hero { padding-top: 24px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { min-height: 82px; padding: 13px 14px; }
      .metric-value { font-size: 20px; }
      .detail-grid { grid-template-columns: 1fr; }
      .config-groups { grid-template-columns: 1fr; }
      .config-kv-item { flex-direction: column; align-items: flex-start; gap: 4px; }
      .config-kv-value { text-align: left; }
      .config-link-wrap { max-width: 100%; width: 100%; justify-content: space-between; }
      .finding-head, .toolbar { align-items: flex-start; flex-direction: column; }
      .badges { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <span class="private">私密报告 · 到期失效</span>
      <a class="home-link" href="/">← 返回首页</a>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Skip MDM · Analysis report</div>
      <h1>监管分析报告</h1>
      <p class="lead">根据设备主动提交的管理组件元数据生成。报告只提供判断依据和手动命令，不会自动修改设备。</p>
    </section>
    <div id="content"><div class="state">正在读取分析结果…</div></div>
  </main>
  <footer class="wrap">报告链接不公开索引，并会在到期后失效。</footer>
  <div class="toast" id="toast" role="status" aria-live="polite">命令已复制</div>
  <script>
    const content = document.getElementById('content');
    const toast = document.getElementById('toast');

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const area = element('textarea');
        area.value = value;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.focus();
        area.select();
        area.setSelectionRange(0, area.value.length);
        let copied = false;
        try { copied = document.execCommand('copy'); } catch { copied = false; }
        area.remove();
        if (!copied) {
          window.prompt('复制失败，请手动复制：', value);
          return;
        }
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function metric(label, value, tone = '') {
      const card = element('article', `metric${tone ? ` ${tone}` : ''}`);
      card.append(element('span', 'metric-label', label), element('strong', 'metric-value', String(value)));
      return card;
    }

    function statusTone(value) {
      return ['yes', 'present', 'user_approved'].includes(value) ? 'alert' : '';
    }

    function statusText(value) {
      const labels = {
        user_approved: '是（用户批准）', yes: '是', no: '否', present: '存在',
        absent: '不存在', available: '可用', unavailable: '命令不可用', error: '检测失败', unknown: '无法确认'
      };
      return labels[value] || value || '无法确认';
    }

    function badgeText(value) {
      const labels = {
        apple: 'Apple 系统', mdm: 'MDM', rmm: '远程运维', internal: '企业内部',
        inventory: '资产清单', security: '终端安全', network: '网络接入', remote: '远程控制',
        system: '系统级', high: '高可信', medium: '中可信', low: '低可信'
      };
      return labels[value] || value;
    }


    function parseEnrollmentConfig(text) {
      if (!text || typeof text !== 'string') return null;
      const raw = text.trim();
      if (!raw || raw.includes('CloudConfigFetchError')) return null;

      function extractString(key) {
        const xmlMatch = raw.match(new RegExp(`<key>${key}</key>\\s*<string>([^<]*)</string>`, 'i'));
        if (xmlMatch) {
          return xmlMatch[1]
            .replace(/&amp;/g, '&')
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/&quot;/g, '"')
            .replace(/&apos;/g, "'")
            .trim();
        }
        const asciiQuoted = raw.match(new RegExp(`(?:^|[\\s;{])${key}\\s*=\\s*"([^"]*)"\\s*;`, 'm'));
        if (asciiQuoted) return asciiQuoted[1].trim();
        const asciiUnquoted = raw.match(new RegExp(`(?:^|[\\s;{])${key}\\s*=\\s*([^;\\n\\r]+?)\\s*;`, 'm'));
        if (asciiUnquoted) {
          const val = asciiUnquoted[1].trim();
          if (!val.startsWith('(') && !val.startsWith('{')) return val;
        }
        return null;
      }

      function extractBoolean(key) {
        const xmlMatch = raw.match(new RegExp(`<key>${key}</key>\\s*(?:<(true|false)/>|<integer>([01])</integer>)`, 'i'));
        if (xmlMatch) {
          if (xmlMatch[1]) return xmlMatch[1].toLowerCase() === 'true';
          if (xmlMatch[2]) return xmlMatch[2] === '1';
        }
        const asciiMatch = raw.match(new RegExp(`(?:^|[\\s;{])${key}\\s*=\\s*([01]|true|false)\\s*;`, 'i'));
        if (asciiMatch) {
          const val = asciiMatch[1].toLowerCase();
          return val === '1' || val === 'true';
        }
        return null;
      }

      function extractInteger(key) {
        const xmlMatch = raw.match(new RegExp(`<key>${key}</key>\\s*<integer>(\\d+)</integer>`, 'i'));
        if (xmlMatch) return parseInt(xmlMatch[1], 10);
        const asciiMatch = raw.match(new RegExp(`(?:^|[\\s;{])${key}\\s*=\\s*(\\d+)\\s*;`, 'm'));
        if (asciiMatch) return parseInt(asciiMatch[1], 10);
        return null;
      }

      function extractArray(key) {
        const xmlMatch = raw.match(new RegExp(`<key>${key}</key>\\s*<array>([\\s\\S]*?)</array>`, 'i'));
        if (xmlMatch) {
          const items = xmlMatch[1].match(/<string>([^<]+)<\/string>/g);
          return items ? items.map((it) => it.replace(/<\/?string>/g, '').trim()) : [];
        }
        const asciiMatch = raw.match(new RegExp(`(?:^|[\\s;{])${key}\\s*=\\s*\\(\\s*([\\s\\S]*?)\\s*\\)\\s*;`, 'm'));
        if (asciiMatch) {
          return asciiMatch[1]
            .split(/[,\n]/)
            .map((s) => s.trim().replace(/^["'\s]+|["'\s]+$/g, ''))
            .filter(Boolean);
        }
        return [];
      }

      const orgName = extractString('OrganizationName');
      const configURL = extractString('ConfigurationURL');
      const isSupervised = extractBoolean('IsSupervised');

      if (!orgName && !configURL && isSupervised === null && !raw.includes('Device Enrollment configuration')) {
        return null;
      }

      return {
        organizationName: orgName,
        organizationDepartment: extractString('OrganizationDepartment'),
        organizationEmail: extractString('OrganizationEmail'),
        organizationSupportEmail: extractString('OrganizationSupportEmail'),
        organizationPhone: extractString('OrganizationPhone'),
        organizationSupportPhone: extractString('OrganizationSupportPhone'),
        organizationAddress: extractString('OrganizationAddress'),
        organizationAddressLine1: extractString('OrganizationAddressLine1'),
        organizationAddressLine2: extractString('OrganizationAddressLine2'),
        organizationCity: extractString('OrganizationCity'),
        organizationCountry: extractString('OrganizationCountry'),
        organizationRegion: extractString('OrganizationRegion'),
        organizationZipCode: extractString('OrganizationZipCode'),
        organizationMagic: extractString('OrganizationMagic'),
        configurationURL: configURL,
        configurationWebURL: extractString('ConfigurationWebURL'),
        mdmServerUID: extractString('MDMServerUID'),
        mdmProtocolVersion: extractInteger('MDMProtocolVersion'),
        isSupervised,
        isMandatory: extractBoolean('IsMandatory'),
        isMDMUnremovable: extractBoolean('IsMDMUnremovable'),
        isMultiUser: extractBoolean('IsMultiUser'),
        allowPairing: extractBoolean('AllowPairing'),
        autoAdvanceSetup: extractBoolean('AutoAdvanceSetup'),
        awaitDeviceConfigured: extractBoolean('AwaitDeviceConfigured'),
        hasUndergoneMigration: extractBoolean('HasUndergoneMigration'),
        ignoreMDMFromBackup: extractBoolean('IgnoreMDMFromBackup'),
        skipSetup: extractArray('SkipSetup'),
        anchorCertificates: extractArray('AnchorCertificates'),
        raw
      };
    }

    function renderManagementDetail(management) {
      const container = element('div', 'management-wrapper');

      function buildEnrollmentCard(cfg) {
        const card = element('section', 'enrollment-config-card');
        const header = element('div', 'enrollment-config-header');
        const titleWrap = element('div');
        titleWrap.append(
          element('h2', '', '云配置与设备注册信息 (Device Enrollment Configuration)'),
          element('p', '', '提取自 macOS 系统的设备配置 (profiles show -type enrollment / .cloudConfigRecordFound)')
        );
        header.append(titleWrap);
        card.append(header);

        // Badges banner
        const badgesWrap = element('div', 'config-badges');
        if (cfg.isSupervised !== null) {
          badgesWrap.append(element('span', `config-pill ${cfg.isSupervised ? 'alert' : 'neutral'}`, cfg.isSupervised ? '✅ 受监管设备 (IsSupervised=1)' : '❌ 未受监管 (IsSupervised=0)'));
        }
        if (cfg.isMandatory !== null) {
          badgesWrap.append(element('span', `config-pill ${cfg.isMandatory ? 'alert' : 'neutral'}`, cfg.isMandatory ? '⚠️ 强制配置 (IsMandatory=1)' : '可选配置'));
        }
        if (cfg.isMDMUnremovable !== null) {
          badgesWrap.append(element('span', `config-pill ${cfg.isMDMUnremovable ? 'alert' : 'neutral'}`, cfg.isMDMUnremovable ? '🔒 MDM 不可移除 (IsMDMUnremovable=1)' : '🔓 MDM 可移除'));
        }
        if (cfg.allowPairing !== null) {
          badgesWrap.append(element('span', `config-pill ${cfg.allowPairing ? 'neutral' : 'alert'}`, cfg.allowPairing ? '✅ 允许配对' : '❌ 禁止配对 (AllowPairing=0)'));
        }
        if (cfg.awaitDeviceConfigured) {
          badgesWrap.append(element('span', 'config-pill alert', '⏳ 等待设备配置 (AwaitDeviceConfigured=1)'));
        }
        if (cfg.isMultiUser) {
          badgesWrap.append(element('span', 'config-pill neutral', '👥 多用户模式 (IsMultiUser=1)'));
        }
        if (cfg.autoAdvanceSetup) {
          badgesWrap.append(element('span', 'config-pill neutral', '⏩ 自动推进安装 (AutoAdvanceSetup=1)'));
        }
        card.append(badgesWrap);

        const groups = element('div', 'config-groups');

        // Group 1: 组织信息
        const orgGroup = element('div', 'config-group');
        orgGroup.append(element('div', 'config-group-title', '🏢 组织机构信息'));
        const orgList = element('div', 'config-kv-list');
        const addKv = (parentList, label, val, isLink = false, copyVal = null, truncate = false) => {
          if (val === null || val === undefined || val === '') return;
          const row = element('div', 'config-kv-item');
          row.append(element('span', 'config-kv-label', label));
          const valWrap = element('span', `config-kv-value${truncate ? ' truncate' : ''}`);
          valWrap.title = String(val);
          if (isLink) {
            const link = element('a', '', val);
            link.href = val;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.title = String(val);
            valWrap.append(link);
          } else {
            valWrap.textContent = String(val);
          }
          if (copyVal) {
            const wrap = element('div', 'config-link-wrap');
            wrap.append(valWrap);
            const copyBtn = element('button', 'config-copy-btn', '复制');
            copyBtn.type = 'button';
            copyBtn.title = '复制完整内容';
            copyBtn.addEventListener('click', () => copyText(copyVal));
            wrap.append(copyBtn);
            row.append(wrap);
          } else {
            row.append(valWrap);
          }
          parentList.append(row);
        };

        addKv(orgList, '组织名称', cfg.organizationName);
        addKv(orgList, '部门', cfg.organizationDepartment);
        addKv(orgList, '组织邮箱', cfg.organizationEmail, false, cfg.organizationEmail);
        addKv(orgList, '支持邮箱', cfg.organizationSupportEmail, false, cfg.organizationSupportEmail);
        addKv(orgList, '组织电话', cfg.organizationPhone, false, cfg.organizationPhone);
        addKv(orgList, '支持电话', cfg.organizationSupportPhone, false, cfg.organizationSupportPhone);
        addKv(orgList, '组织地址', cfg.organizationAddress);
        const cityCountryZip = [cfg.organizationCity, cfg.organizationRegion, cfg.organizationCountry, cfg.organizationZipCode].filter(Boolean).join(' · ');
        if (cityCountryZip && cityCountryZip !== cfg.organizationAddress) {
          addKv(orgList, '城市 / 国家 / 邮编', cityCountryZip);
        }
        addKv(orgList, '组织 Magic 码', cfg.organizationMagic, false, cfg.organizationMagic, true);
        orgGroup.append(orgList);

        // Group 2: MDM 服务端配置
        const mdmGroup = element('div', 'config-group');
        mdmGroup.append(element('div', 'config-group-title', '☁️ MDM 服务端配置'));
        const mdmList = element('div', 'config-kv-list');
        addKv(mdmList, '配置 URL (ConfigurationURL)', cfg.configurationURL, true, cfg.configurationURL, true);
        addKv(mdmList, '认证网页 (ConfigurationWebURL)', cfg.configurationWebURL, true, cfg.configurationWebURL, true);
        addKv(mdmList, 'MDM 服务器 UID', cfg.mdmServerUID, false, cfg.mdmServerUID, true);
        addKv(mdmList, 'MDM 协议版本', cfg.mdmProtocolVersion);
        addKv(mdmList, 'MDM 注册状态', statusText(management.mdmEnrollment));
        addKv(mdmList, '自动化注册 (ADE / DEP)', statusText(management.automatedEnrollment));
        mdmGroup.append(mdmList);

        // Group 3: 设备设置与限制策略
        const devGroup = element('div', 'config-group');
        devGroup.append(element('div', 'config-group-title', '⚙️ 设备策略与约束'));
        const devList = element('div', 'config-kv-list');
        addKv(devList, '是否受监管 (IsSupervised)', cfg.isSupervised !== null ? (cfg.isSupervised ? '✅ 是' : '❌ 否') : null);
        addKv(devList, '是否强制注册 (IsMandatory)', cfg.isMandatory !== null ? (cfg.isMandatory ? '✅ 是' : '❌ 否') : null);
        addKv(devList, 'MDM 不可移除 (IsMDMUnremovable)', cfg.isMDMUnremovable !== null ? (cfg.isMDMUnremovable ? '✅ 是' : '❌ 否') : null);
        addKv(devList, '允许配对 (AllowPairing)', cfg.allowPairing !== null ? (cfg.allowPairing ? '✅ 允许 (1)' : '❌ 禁止 (0)') : null);
        addKv(devList, '等待设备配置 (AwaitDeviceConfigured)', cfg.awaitDeviceConfigured !== null ? (cfg.awaitDeviceConfigured ? '✅ 是 (1)' : '❌ 否 (0)') : null);
        addKv(devList, '多用户模式 (IsMultiUser)', cfg.isMultiUser !== null ? (cfg.isMultiUser ? '✅ 是 (1)' : '❌ 否 (0)') : null);
        addKv(devList, '自动推进设置 (AutoAdvanceSetup)', cfg.autoAdvanceSetup !== null ? (cfg.autoAdvanceSetup ? '✅ 是 (1)' : '❌ 否 (0)') : null);
        addKv(devList, '已迁移 (HasUndergoneMigration)', cfg.hasUndergoneMigration !== null ? (cfg.hasUndergoneMigration ? '✅ 是' : '❌ 否') : null);
        addKv(devList, '从备份忽略 MDM (IgnoreMDMFromBackup)', cfg.ignoreMDMFromBackup !== null ? (cfg.ignoreMDMFromBackup ? '✅ 是' : '❌ 否') : null);
        addKv(devList, '云配置记录文件', statusText(management.cloudConfigRecord));
        addKv(devList, '云配置描述文件', statusText(management.cloudConfigProfileInstalled));
        devGroup.append(devList);

        // Group 4: 证书与跳过步骤 (如果都有或其中一个有)
        const otherGroup = element('div', 'config-group');
        otherGroup.append(element('div', 'config-group-title', '⏭️ 跳过的设置助手步骤 (SkipSetup)'));
        if (Array.isArray(cfg.skipSetup) && cfg.skipSetup.length > 0) {
          const skipTagsWrap = element('div', 'skip-setup-tags');
          for (const s of cfg.skipSetup) {
            skipTagsWrap.append(element('span', 'skip-setup-tag', s));
          }
          otherGroup.append(skipTagsWrap);
        } else {
          otherGroup.append(element('div', 'empty-state', '无跳过项或未配置'));
        }

        if (Array.isArray(cfg.anchorCertificates) && cfg.anchorCertificates.length > 0) {
          const certTitle = element('div', 'config-group-title', '🔒 锚点证书 (AnchorCertificates)');
          certTitle.style.marginTop = '12px';
          otherGroup.append(certTitle);
          const certTags = element('div', 'skip-setup-tags');
          for (const c of cfg.anchorCertificates) {
            certTags.append(element('span', 'skip-setup-tag', c));
          }
          otherGroup.append(certTags);
        }
        groups.append(orgGroup, mdmGroup, devGroup, otherGroup);
        card.append(groups);

        // Raw configuration collapsible
        if (cfg.raw) {
          const rawDetails = element('details', 'raw-config-details');
          const summary = element('summary', 'raw-config-summary');
          summary.append(element('span', '', '查看完整配置 (Device Enrollment configuration · 点击展开)'));
          const preWrap = element('div', 'raw-config-pre-wrap');
          const copyRawBtn = element('button', 'raw-config-copy-btn', '复制完整配置');
          copyRawBtn.type = 'button';
          copyRawBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            copyText(cfg.raw);
          });
          const pre = element('pre', '', cfg.raw);
          preWrap.append(copyRawBtn, pre);
          rawDetails.append(summary, preWrap);
          card.append(rawDetails);
        }

        return card;
      }

      if (management.enrollmentConfiguration) {
        container.append(buildEnrollmentCard(management.enrollmentConfiguration));
      } else {
        // Render fallback summary card
        const baseSection = element('section', 'management-detail');
        baseSection.append(
          element('h2', '', '云配置与监管状态'),
          element('p', '', '展示设备本地云配置与描述文件记录；完整 URL、证书和 plist 敏感内容不会上传。')
        );
        let supervisedLabel = '否（未受监管 / 正常个人设备）';
        const hasValidCloudConfig = Boolean(management.enrollmentConfiguration || management.cloudConfigDomain);
        if (management.mdmEnrollment === 'yes' || management.automatedEnrollment === 'yes') {
          supervisedLabel = '是（已激活 MDM 监管）';
        } else if (hasValidCloudConfig && (management.cloudConfigRecord === 'present' || management.cloudConfigProfileInstalled === 'present')) {
          supervisedLabel = '否（当前未激活 MDM；仅存留本地云配置记录）';
        }
        const fields = [
          ['是否受监管 (IsSupervised)', supervisedLabel],
          ['MDM 注册状态', statusText(management.mdmEnrollment)],
          ['自动化设备注册 (ADE / DEP)', statusText(management.automatedEnrollment)],
          ['云配置记录 (.cloudConfigRecordFound)', statusText(management.cloudConfigRecord)],
          ['云配置描述文件', statusText(management.cloudConfigProfileInstalled)],
          ['MDM / 配置域名 (ConfigurationURL)', management.cloudConfigDomain || '未读取到'],
          ['Profiles 诊断命令', statusText(management.profilesCommand)],
          ['运行中系统级进程', `${management.runningProcessCount || 0} 个`]
        ];
        const grid = element('div', 'detail-grid');
        for (const field of fields) {
          const row = element('div', 'detail-row');
          row.append(element('span', 'detail-label', field[0]), element('strong', 'detail-value', field[1]));
          grid.append(row);
        }
        baseSection.append(grid);

        // Interactive Paste / Test configuration
        const pasteDetails = element('details', 'raw-config-details');
        const pasteSummary = element('summary', 'raw-config-summary');
        pasteSummary.append(element('span', '', '📋 本次扫描未获取到完整配置文本？点击可手动粘贴 Device Enrollment configuration 进行即时渲染'));
        const pasteBox = element('div', 'paste-config-box');
        const textarea = element('textarea', 'paste-config-textarea');
        textarea.placeholder = '在此粘贴 profiles show -type enrollment 输出的 Device Enrollment configuration: { ... } 或 XML 描述内容...';
        const actions = element('div', 'paste-config-actions');
        const renderBtn = element('button', 'comp-action-btn', '立即渲染配置');
        renderBtn.type = 'button';
        renderBtn.style.padding = '8px 16px';
        renderBtn.style.background = 'var(--green)';
        renderBtn.style.color = 'white';
        renderBtn.style.borderColor = 'var(--green)';
        renderBtn.addEventListener('click', () => {
          const text = textarea.value.trim();
          if (!text) {
            window.alert('请先粘贴配置文本');
            return;
          }
          const parsed = parseEnrollmentConfig(text);
          if (!parsed) {
            window.alert('无法解析配置文本，请确认包含 Device Enrollment configuration 或有效键值');
            return;
          }
          container.innerHTML = '';
          container.append(buildEnrollmentCard(parsed));
        });
        actions.append(renderBtn);
        pasteBox.append(textarea, actions);
        pasteDetails.append(pasteSummary, pasteBox);
        baseSection.append(pasteDetails);

        container.append(baseSection);
      }

      return container;
    }



    function renderHealthBanner(health, management) {
      if (!health) return null;
      if (health.status === 'unhealthy' && Array.isArray(health.unexpectedAppleHostOverrides) && health.unexpectedAppleHostOverrides.length > 0) {
        const section = element('section', 'health-warning');
        section.append(
          element('h2', '', '系统不健康'),
          element('p', '', '/etc/hosts 中存在非预期的 Apple 服务域名覆盖，部分 Apple 服务可能不可用。请核对以下域名：')
        );
        const list = element('ul', 'health-hosts');
        for (const hostname of health.unexpectedAppleHostOverrides) list.append(element('li', '', hostname));
        section.append(list);
        return section;
      }

      if (Array.isArray(health.appleHostOverrides) && health.appleHostOverrides.length > 0) {
        const section = element('section', 'health-shield');
        section.append(
          element('h3', '', '🛡️ MDM 域名网络屏蔽已生效'),
          element('p', '', '已通过 /etc/hosts 阻断 Apple 设备注册服务，可有效防止系统后台静默联网重新激活监管或弹出提醒：')
        );
        const tags = element('div', 'health-shield-tags');
        for (const h of health.appleHostOverrides) {
          tags.append(element('span', 'health-shield-tag', h));
        }
        section.append(tags);
        return section;
      }

      const hasCloudRecord = management && (management.cloudConfigRecord === 'present' || management.cloudConfigProfileInstalled === 'present' || management.enrollmentConfiguration);
      if (hasCloudRecord) {
        const section = element('section', 'health-notice');
        section.append(
          element('h3', '', '💡 提示：/etc/hosts 未检测到 Apple MDM 屏蔽'),
          element('p', '', '当前设备未在 /etc/hosts 中屏蔽 Apple 注册服务器（如 iprofiles.apple.com）。若设备在联网状态下重新触发监管配置或弹窗，建议在 Hosts 中添加屏蔽条目以阻止自动连线。')
        );
        return section;
      }

      return null;
    }

    function renderFinding(finding) {
      const card = element('article', `finding ${finding.category === 'apple' ? 'apple' : ''}`);
      const head = element('div', 'finding-head');
      const title = element('div');
      title.append(element('h3', '', finding.product), element('p', 'company', finding.company));
      const badges = element('div', 'badges');
      badges.append(element('span', `badge ${finding.category === 'apple' ? 'system' : ''}`, badgeText(finding.category)));
      badges.append(element('span', 'badge', badgeText(finding.confidence)));
      if (finding.states && finding.states.running) badges.append(element('span', 'badge', '正在运行'));
      if (finding.states && finding.states.persistent) badges.append(element('span', 'badge', '已持久化'));
      head.append(title, badges);
      card.append(head);

      if (finding.assessment === 'normal_system_component') {
        card.append(element('p', 'normal-note', '这是 macOS 正常的系统管理组件，存在属于正常现象，无需担心。禁止删除系统文件。'));
      } else if (finding.category === 'apple') {
        card.append(element('p', 'warning', '这是 Apple 原生系统组件。它的存在不等于设备已注册 MDM，禁止删除系统文件。'));
      } else if (!finding.removable) {
        card.append(element('p', 'warning', '当前只有运行态、注册记录或其他只读证据，报告不会据此生成删除命令。'));
      }

      const details = element('details');
      const summary = element('summary', '', `查看 ${finding.evidence.length} 条证据`);
      const list = element('ul', 'evidence');
      for (const item of finding.evidence) {
        const values = [item.type, item.path, item.label, item.program, item.bundleId, item.teamId, item.signingId, item.packageId, item.status, item.detail].filter(Boolean);
        list.append(element('li', '', values.join(' · ')));
      }
      details.append(summary, list);
      card.append(details);

      if (finding.commands.length > 0) {
        const box = element('div', 'command-box');
        const boxHead = element('div', 'command-head');
        const commands = finding.commands.join('\n');
        const button = element('button', 'copy', '复制命令');
        button.type = 'button';
        button.addEventListener('click', () => copyText(commands));
        boxHead.append(element('span', '', 'Manual removal'), button);
        box.append(boxHead, element('pre', '', commands));
        card.append(box);
      }
      return card;
    }

    function render(payload) {
      const report = payload.report;
      const management = report.source.management || {};
      const healthBanner = renderHealthBanner(report.source.health, management);
      content.textContent = '';
      const summary = element('section', 'summary');
      const hasHostsBlocked = report.source.health && Array.isArray(report.source.health.appleHostOverrides) && report.source.health.appleHostOverrides.length > 0;
      summary.append(
        metric('采集项目', report.source.itemCount),
        metric('发现组件', report.summary.findingCount),
        metric('可处理项', report.summary.removableCount, report.summary.removableCount > 0 ? 'success' : ''),
        metric('MDM 注册', statusText(management.mdmEnrollment), statusTone(management.mdmEnrollment)),
        metric('ADE/DEP', statusText(management.automatedEnrollment), statusTone(management.automatedEnrollment)),
        metric('云配置记录', statusText(management.cloudConfigRecord), statusTone(management.cloudConfigRecord)),
        metric('Hosts 屏蔽', hasHostsBlocked ? `${report.source.health.appleHostOverrides.length} 个域名` : '未屏蔽', hasHostsBlocked ? 'success' : ''),
        metric('运行进程', management.runningProcessCount || 0)
      );
      const toolbar = element('div', 'toolbar');
      const heading = element('div');
      heading.append(element('h2', '', '组件与处理建议'), element('p', '', `报告到期：${new Date(payload.expires_at).toLocaleString()}`));
      const reanalyzeButton = element('button', 'reanalyze', '重新分析');
      reanalyzeButton.type = 'button';
      reanalyzeButton.addEventListener('click', () => reanalyze(reanalyzeButton));
      toolbar.append(heading, reanalyzeButton);
      const list = element('section', 'finding-list');
      if (report.findings.length === 0) list.append(element('div', 'state', '没有匹配到当前规则库中的监管组件。'));
      for (const finding of report.findings) list.append(renderFinding(finding));
      content.append(summary);
      if (healthBanner) content.append(healthBanner);
      content.append(renderManagementDetail(management), toolbar, list);
    }

    async function reanalyze(button) {
      button.disabled = true;
      button.textContent = '正在重新分析…';
      const id = location.pathname.split('/').filter(Boolean).pop();
      try {
        const response = await fetch(`/api/college/${encodeURIComponent(id)}/reanalyze`, {
          method: 'POST',
          headers: { Accept: 'application/json' }
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'reanalyze_failed');
        render(payload);
      } catch (error) {
        button.disabled = false;
        button.textContent = '重新分析';
        window.alert(error.message === 'report_source_unavailable' ? '原始扫描数据不可用，无法重新分析。' : '重新分析失败，请稍后重试。');
      }
    }

    async function loadReport(polling = false) {
      const id = location.pathname.split('/').filter(Boolean).pop();
      try {
        const response = await fetch(`/api/college/${encodeURIComponent(id)}`, {
          headers: { Accept: 'application/json' }
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'load_failed');
        if (payload.status === 'pending') {
          content.textContent = '';
          content.append(element('div', 'state', '报告已创建，正在等待设备完成扫描和上传…'));
          setTimeout(() => loadReport(true), 3000);
          return;
        }
        render(payload);
      } catch (error) {
        if (polling) {
          content.textContent = '';
          content.append(element('div', 'state', '报告暂时无法读取，请刷新页面后重试。'));
        } else {
          content.textContent = '';
          content.append(element('div', 'state', error.message === 'report_not_found' ? '报告不存在或已经过期。' : '暂时无法读取报告，请稍后重试。'));
        }
      }
    }

    loadReport();
  </script>
</body>
</html>
