    // ==================== 设备详情功能 ====================
    function showLogDetails(index) {
        const device = filteredLogs[index];
        if (!device) return;

        const recovery = device.recovery;
        const desktop = device.desktop;
        const serial = device.serial_number || '未知设备';

        // 设置模态窗口标题
        document.getElementById('modalTitle').textContent = `设备详情 - ${serial}`;

        // 计算总数（恢复模式数量 + 桌面模式数量，不再合并去重）
        // 注意：recovery 和 desktop 已经是同一序列号下同模式数据合并去重后的结果
        const getTotalCount = (recoveryData, desktopData) => {
            const recoveryCount = recoveryData ? recoveryData.length : 0;
            const desktopCount = desktopData ? desktopData.length : 0;
            return recoveryCount + desktopCount;
        };

        const totalCounts = {
            volumes: getTotalCount(recovery?.logs?.volumes, desktop?.logs?.volumes),
            launch_agents: getTotalCount(recovery?.logs?.launch_agents, desktop?.logs?.launch_agents),
            launch_daemons: getTotalCount(recovery?.logs?.launch_daemons, desktop?.logs?.launch_daemons),
            users: getTotalCount(recovery?.logs?.users, desktop?.logs?.users),
            applications: getTotalCount(recovery?.logs?.applications, desktop?.logs?.applications),
            app_support: getTotalCount(recovery?.logs?.app_support, desktop?.logs?.app_support),
            user_prefs: getTotalCount(recovery?.logs?.user_prefs, desktop?.logs?.user_prefs),
            sys_prefs: getTotalCount(recovery?.logs?.sys_prefs, desktop?.logs?.sys_prefs),
            mdm_settings: getTotalCount(recovery?.logs?.mdm_settings, desktop?.logs?.mdm_settings),
            process_list: getTotalCount(recovery?.logs?.process_list, desktop?.logs?.process_list)
        };

        // 判断是否只有一种模式
        const hasBothModes = recovery && desktop;
        const primaryLog = desktop || recovery;
        const timestamp = primaryLog ? new Date(primaryLog.timestamp).toLocaleString('zh-CN') : '未知';
        const clientTimestamp = primaryLog ? new Date(primaryLog.logs.timestamp).toLocaleString('zh-CN') : '未知';

        // 生成数据项（按模式分组显示，只用颜色区分）
        // 重要说明：
        // 1. recoveryData 和 desktopData 已经是同一序列号下同模式数据合并去重后的结果
        // 2. 直接显示这两种模式的数据，不再进行任何去重操作
        // 3. 总数 = 恢复模式数量 + 桌面模式数量（不再合并去重）
        const renderDataItem = (title, recoveryData, desktopData, key) => {
            const hasRecovery = recovery && recoveryData && recoveryData.length > 0;
            const hasDesktop = desktop && desktopData && desktopData.length > 0;

            if (!hasRecovery && !hasDesktop) return '';

            // 计算总数（恢复模式数量 + 桌面模式数量，不再合并去重）
            const totalCount = totalCounts[key];

            return `
                <div class="modal-detail-section">
                        <div class="modal-detail-title">${title} (${totalCount})</div>
                        <div class="modal-detail-content" style="flex: 1; min-height: 0;">
                            ${hasRecovery ? `
                                <div style="border-bottom: 2px solid #ffc107; padding-bottom: 10px; ${hasDesktop ? 'margin-bottom: 10px;' : ''}">
                        <ul class="modal-detail-list">
                                        ${recoveryData.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                            ` : ''}
                            ${hasDesktop ? `
                                <div style="border-bottom: 2px solid #28a745; padding-bottom: 10px;">
                        <ul class="modal-detail-list">
                                        ${desktopData.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                            ` : ''}
                </div>
                    </div>
                `;
        };

        // 收集去重后的 IP 地址和系统版本
        const allIPs = new Set();
        if (recovery?.ip) allIPs.add(recovery.ip);
        if (desktop?.ip) allIPs.add(desktop.ip);
        const uniqueIPs = Array.from(allIPs).filter(ip => ip && ip.trim() !== '');

        const allVersions = new Set();
        if (recovery?.logs?.os_version) allVersions.add(recovery.logs.os_version);
        if (desktop?.logs?.os_version) allVersions.add(desktop.logs.os_version);
        const uniqueVersions = Array.from(allVersions).filter(v => v && v.trim() !== '');

        // 生成模态窗口内容
        const modalContent = `
                <div class="modal-detail-section short-section">
                    <div class="modal-detail-title">基本信息</div>
                    <div class="modal-detail-content">
                        <div><strong>序列号:</strong> ${serial}</div>
                        <div><strong>服务端时间:</strong> ${timestamp}</div>
                        <div><strong>客户端时间:</strong> ${clientTimestamp}</div>
                        <div><strong>MDM域名:</strong> ${primaryLog?.logs?.mdm_domains || '未知'}</div>
                        ${uniqueIPs.length > 0 ? `
                            <div><strong>IP地址:</strong> ${uniqueIPs.join(', ')}</div>
                        ` : `
                            <div><strong>IP地址:</strong> 未知</div>
                        `}
                        ${uniqueVersions.length > 0 ? `
                            <div><strong>系统版本:</strong> ${uniqueVersions.join(', ')}</div>
                        ` : `
                            <div><strong>系统版本:</strong> 未知</div>
                        `}
                    </div>
                </div>

                ${renderDataItem('挂载卷', recovery?.logs?.volumes, desktop?.logs?.volumes, 'volumes')}
                ${renderDataItem('应用程序', recovery?.logs?.applications, desktop?.logs?.applications, 'applications')}
                ${renderDataItem('启动代理', recovery?.logs?.launch_agents, desktop?.logs?.launch_agents, 'launch_agents')}
                ${renderDataItem('启动守护进程', recovery?.logs?.launch_daemons, desktop?.logs?.launch_daemons, 'launch_daemons')}
                ${renderDataItem('MDM设置', recovery?.logs?.mdm_settings, desktop?.logs?.mdm_settings, 'mdm_settings')}
                ${renderDataItem('应用支持', recovery?.logs?.app_support, desktop?.logs?.app_support, 'app_support')}
                ${renderDataItem('用户偏好', recovery?.logs?.user_prefs, desktop?.logs?.user_prefs, 'user_prefs')}
                ${renderDataItem('系统偏好', recovery?.logs?.sys_prefs, desktop?.logs?.sys_prefs, 'sys_prefs')}
                ${renderDataItem('系统用户', recovery?.logs?.users, desktop?.logs?.users, 'users')}
                ${renderDataItem('进程列表', recovery?.logs?.process_list, desktop?.logs?.process_list, 'process_list')}
            `;

        // 单独处理云配置 - 使用可视化显示（复用全局函数）
        let cloudConfigHtml = '';

        const allConfigs = [];
        if (desktop?.logs?.cloud_config) {
            allConfigs.push({...evaluateCloudConfig(desktop.logs.cloud_config), parsed: parseCloudConfig(desktop)});
        }
        if (recovery?.logs?.cloud_config) {
            allConfigs.push({...evaluateCloudConfig(recovery.logs.cloud_config), parsed: parseCloudConfig(recovery)});
        }

        if (allConfigs.length > 0) {
            allConfigs.sort((a, b) => b.score - a.score);
            const bestConfig = allConfigs[0];
            const parsed = bestConfig.parsed;

            if (parsed && parsed.extracted) {
                // 使用全局函数渲染云配置信息
                cloudConfigHtml = `
                        <div class="modal-detail-section cloud-config-section">
                            <div class="modal-detail-title">云配置信息${allConfigs.length > 1 ? ` (已选择最优配置，共${allConfigs.length}个)` : ''}</div>
                            <div class="modal-detail-content" id="cloudConfigContent">
                                ${renderCloudConfigInfo(parsed, true, allConfigs.length)}
                    </div>
                </div>
                    `;
            } else {
                // 如果解析失败，显示原始配置
                cloudConfigHtml = `
                        <div class="modal-detail-section cloud-config-section">
                            <div class="modal-detail-title">云配置信息${allConfigs.length > 1 ? ` (已选择最优配置，共${allConfigs.length}个)` : ''}</div>
                            <div class="modal-detail-content" id="cloudConfigContent" style="font-family: monospace;">
                                ${bestConfig.config}
                    </div>
                </div>
                    `;
            }
        }

        // 使用瀑布流布局，根据屏幕宽度动态确定列数
        const modalContentElement = document.getElementById('modalContent');
        modalContentElement.innerHTML = '';

        // 根据实际可用宽度确定列数（考虑 margin、gap、padding）
        // 列的最小宽度和间距
        const minColumnWidth = 350; // modal-details-column 的 min-width
        const gap = 20; // modal-details 的 gap

        // 计算可以容纳的列数
        const screenWidth = window.innerWidth;
        let columnCount = 1; // 默认1列

        if (screenWidth <= 768) {
            columnCount = 1; // 小屏幕1列
        } else {
            // 计算所需宽度
            const widthFor3Columns = minColumnWidth * 3 + gap * 2; // 1090px
            const widthFor2Columns = minColumnWidth * 2 + gap * 1; // 720px

            // 估算可用宽度：modal-content width(1200px) - modal-body padding(30px*2) = 1140px
            // 或者使用屏幕宽度减去边距
            let estimatedWidth = 1200 - 60; // modal-content width - modal-body padding
            if (screenWidth < 1200) {
                // 如果屏幕宽度小于 modal-content 宽度，使用屏幕宽度估算
                estimatedWidth = screenWidth - 220; // 减去各种 padding 和边距
            }

            if (estimatedWidth >= widthFor3Columns) {
                columnCount = 3; // 可以容纳3列
            } else if (estimatedWidth >= widthFor2Columns) {
                columnCount = 2; // 可以容纳2列
            } else {
                columnCount = 1; // 只能容纳1列
            }
        }

        // 创建列容器
        const columns = [];
        const columnsContainer = document.createElement('div');
        columnsContainer.className = 'modal-details';
        for (let i = 0; i < columnCount; i++) {
            const column = document.createElement('div');
            column.className = 'modal-details-column';
            columnsContainer.appendChild(column);
            columns.push({element: column, height: 0});
        }
        modalContentElement.appendChild(columnsContainer);

        // 创建一个临时容器来测量每个section的高度
        const tempContainer = document.createElement('div');
        tempContainer.style.position = 'absolute';
        tempContainer.style.visibility = 'hidden';
        tempContainer.style.top = '-9999px';
        tempContainer.style.left = '-9999px';
        document.body.appendChild(tempContainer);

        // 等待一帧确保列已渲染，然后计算和分配
        requestAnimationFrame(() => {
            // 第一步：获取实际可用宽度并重新计算列数（如果之前是估算的）
            const modalWidth = modalContentElement.offsetWidth;
            if (modalWidth) {
                const minColumnWidth = 350;
                const gap = 20;
                const widthFor3Columns = minColumnWidth * 3 + gap * 2;
                const widthFor2Columns = minColumnWidth * 2 + gap * 1;

                // 如果实际宽度不足以支持当前列数，重新计算
                let actualColumnCount = columnCount;
                if (modalWidth >= widthFor3Columns && columnCount < 3) {
                    actualColumnCount = 3;
                } else if (modalWidth >= widthFor2Columns && columnCount < 2) {
                    actualColumnCount = 2;
                } else if (modalWidth < widthFor2Columns) {
                    actualColumnCount = 1;
                }

                // 如果列数发生变化，需要重新创建列
                if (actualColumnCount !== columnCount) {
                    columnCount = actualColumnCount;
                    // 移除旧的列
                    columnsContainer.innerHTML = '';
                    columns.length = 0;
                    // 创建新的列
                    for (let i = 0; i < columnCount; i++) {
                        const column = document.createElement('div');
                        column.className = 'modal-details-column';
                        columnsContainer.appendChild(column);
                        columns.push({element: column, height: 0});
                    }
                }
            }

            // 计算列宽度
            const gap = 20;
            const modalWidthFinal = modalContentElement.offsetWidth || window.innerWidth - 220;
            const columnWidth = (modalWidthFinal - (gap * (columnCount - 1))) / columnCount;
            tempContainer.style.width = columnWidth + 'px';

            // 第二步：将modalContent字符串转换为DOM元素并去重
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = modalContent;
            const allSections = Array.from(tempDiv.children);

            // 过滤有效的 section（排除云配置）
            const validSections = allSections.filter(section => {
                return section &&
                    section.classList &&
                    section.classList.contains('modal-detail-section') &&
                    !section.classList.contains('cloud-config-section') &&
                    section.textContent.trim() !== '';
            });

            // 去重：根据标题去重
            const seenTitles = new Set();
            const uniqueSections = [];

            validSections.forEach(section => {
                const titleElement = section.querySelector('.modal-detail-title');
                if (!titleElement) {
                    const content = section.textContent.trim();
                    const contentKey = 'no-title-' + content.substring(0, 50);
                    if (!seenTitles.has(contentKey)) {
                        seenTitles.add(contentKey);
                        uniqueSections.push(section);
                    }
                    return;
                }

                const title = titleElement.textContent.trim();
                const baseTitle = title.replace(/\s*\(\d+\)\s*$/, '').trim();
                if (!seenTitles.has(baseTitle)) {
                    seenTitles.add(baseTitle);
                    uniqueSections.push(section);
                }
            });

            // 第三步：计算每个section的高度
            const sectionsWithHeight = uniqueSections.map(section => {
                const clone = section.cloneNode(true);
                tempContainer.appendChild(clone);
                const height = clone.offsetHeight;
                tempContainer.removeChild(clone);
                return {section, height: height + gap}; // 包含gap
            });

            // 第四步：智能分配，使各列高度尽可能接近
            // 按高度降序排序，优先分配高的section（这样可以更好地平衡）
            sectionsWithHeight.sort((a, b) => b.height - a.height);

            // 初始化各列高度
            columns.forEach(col => col.height = 0);

            // 优化分配算法：每次选择当前高度最小的列，放入下一个section
            // 这样可以尽可能让各列高度接近
            sectionsWithHeight.forEach(({section, height}) => {
                // 找到当前高度最小的列（不一定要第一列）
                let minHeightColumn = columns[0];
                let minHeight = columns[0].height;
                columns.forEach(col => {
                    if (col.height < minHeight) {
                        minHeight = col.height;
                        minHeightColumn = col;
                    }
                });

                // 将section添加到高度最小的列
                const sectionClone = section.cloneNode(true);
                minHeightColumn.element.appendChild(sectionClone);
                minHeightColumn.height += height;
            });

            // 输出各列高度统计（用于调试）
            const columnHeights = columns.map(col => col.height);
            const maxHeight = Math.max(...columnHeights);
            const minHeight = Math.min(...columnHeights);
            const heightDiff = maxHeight - minHeight;
            console.log('列高度统计:', columnHeights, '最大高度差:', heightDiff.toFixed(0) + 'px');

            // 清理临时容器
            document.body.removeChild(tempContainer);

        });

        // 添加云配置（单独一行，放在最底部，不加入列）
        // 在 requestAnimationFrame 外部添加，确保总是执行
        if (cloudConfigHtml && cloudConfigHtml.trim() !== '') {
            // 使用 setTimeout 确保在所有列渲染完成后再添加
            setTimeout(() => {
                // 检查是否已经存在云配置容器，避免重复添加
                let cloudConfigContainer = modalContentElement.querySelector('.cloud-config-container');
                if (!cloudConfigContainer) {
                    cloudConfigContainer = document.createElement('div');
                    cloudConfigContainer.className = 'cloud-config-container';
                    cloudConfigContainer.style.width = '100%';
                    cloudConfigContainer.style.marginTop = '20px';
                    modalContentElement.appendChild(cloudConfigContainer);
                }
                // 直接设置 HTML，因为 cloudConfigHtml 已经包含了完整的可视化内容
                cloudConfigContainer.innerHTML = cloudConfigHtml;
            }, 150);
        }

        document.getElementById('logModal').classList.add('show');
    }

    // 关闭模态窗口
    function closeModal() {
        document.getElementById('logModal').classList.remove('show');
    }

    // 点击模态窗口背景关闭
    document.getElementById('logModal').addEventListener('click', function (e) {
        if (e.target === this) {
            closeModal();
        }
    });

    // ESC键关闭模态窗口
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeModal();
        }
    });

    // 守护进程分析功能
    function analyzeDaemons() {
        if (allLogs.length === 0) {
            alert('请先加载日志数据');
            return;
        }

        // 按序列号和模式分组，去重处理
        const deviceMap = new Map(); // key: serial_number, value: { desktop: log, recovery: log }

        allLogs.forEach(log => {
            if (!log.logs || !log.logs.serial_number) return;

            const serial = log.logs.serial_number;
            const isDesktop = log.logs.os_type === true;
            const mode = isDesktop ? 'desktop' : 'recovery';

            if (!deviceMap.has(serial)) {
                deviceMap.set(serial, {desktop: null, recovery: null});
            }

            const device = deviceMap.get(serial);

            // 如果该模式下还没有数据，或者当前数据更新（时间更晚），则更新
            if (!device[mode] || new Date(log.timestamp) > new Date(device[mode].timestamp)) {
                device[mode] = log;
            }
        });

        // 统计守护进程（按唯一设备统计，不区分模式）
        const daemonCounts = {};
        let devicesWithDaemons = 0;
        let totalUniqueDevices = deviceMap.size;

        deviceMap.forEach((device, serial) => {
            // 收集该设备所有模式下的守护进程（去重）
            const allDaemons = new Set();

            // 处理桌面模式
            if (device.desktop && device.desktop.logs && device.desktop.logs.launch_daemons) {
                const daemons = device.desktop.logs.launch_daemons;
                if (Array.isArray(daemons) && daemons.length > 0) {

            // 处理恢复模式

    // 云配置提取功能
    function extractCloudConfig() {
        if (allLogs.length === 0) {
            alert('请先加载日志数据');
            return;
        }

        // 按序列号分组，区分恢复模式和桌面模式
        const deviceMap = new Map(); // key: serial_number, value: { desktop: log, recovery: log }

        allLogs.forEach(log => {
            if (!log.logs || !log.logs.serial_number) return;
            if (!log.logs.cloud_config || log.logs.cloud_config.trim() === '') return;

            const serial = log.logs.serial_number;
            const isDesktop = log.logs.os_type === true;
            const mode = isDesktop ? 'desktop' : 'recovery';

            if (!deviceMap.has(serial)) {
                deviceMap.set(serial, {desktop: null, recovery: null});
            }

            const device = deviceMap.get(serial);

            // 如果该模式下还没有数据，或者当前数据更新（时间更晚），则更新
            if (!device[mode] || new Date(log.timestamp) > new Date(device[mode].timestamp)) {
                device[mode] = log;
            }
        });

        if (deviceMap.size === 0) {
            alert('没有找到包含云配置的数据');
            return;
        }

        // 使用全局的 parseCloudConfig 函数（已提取到全局作用域）

        // 处理每个设备的云配置
        const deviceConfigs = [];
        let desktopCount = 0;
        let recoveryCount = 0;

        deviceMap.forEach((device, serial) => {
            const config = {
                serial_number: serial,
                desktop: null,
                recovery: null
            };

            if (device.desktop) {
                config.desktop = parseCloudConfig(device.desktop);
                desktopCount++;
            }
            if (device.recovery) {
                config.recovery = parseCloudConfig(device.recovery);
                recoveryCount++;
            }

            deviceConfigs.push(config);
        });

        // 生成提取结果HTML（扁平化结构，每个模式一个 modal-detail-section）
        // 复用全局的 renderCloudConfigInfo 函数
        const renderConfigDetail = (detail, mode, serialNumber, deviceIndex) => {
            if (!detail) return '';
            const modeColor = mode === 'desktop' ? '#28a745' : '#ffc107';
            const timestamp = new Date(detail.log.timestamp).toLocaleString('zh-CN');

            return `
                    <div class="modal-detail-section" style="grid-column: 1 / -1; border-left: 4px solid ${modeColor};">
                        <div class="modal-detail-title">设备 ${deviceIndex}: ${serialNumber}</div>
                    <div class="modal-detail-content">
                            <div style="margin-bottom: 15px; color: #6c757d; font-size: 0.9em;">
                                <div><strong>IP地址:</strong> ${detail.log.ip || '未知'}</div>
                                <div><strong>时间:</strong> ${timestamp}</div>
                    </div>
                            ${renderCloudConfigInfo(detail, true, 1)}
                </div>
                    </div>
                `;
        };

        const extractionHtml = `
                <div class="modal-detail-section" style="grid-column: 1 / -1;">
                    <div class="modal-detail-title">云配置提取总结</div>
                    <div class="modal-detail-content">
                        <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            <div><strong>唯一设备数（去重后）:</strong> ${deviceMap.size}</div>
                            <div><strong>总日志记录数:</strong> ${allLogs.length}</div>
                            <div><strong>桌面模式有配置的设备:</strong> ${desktopCount}</div>
                            <div><strong>恢复模式有配置的设备:</strong> ${recoveryCount}</div>
                    </div>
                </div>
                </div>
                ${deviceConfigs.map((config, index) => {
            if (!config.desktop && !config.recovery) {
                return `
                            <div class="modal-detail-section" style="grid-column: 1 / -1;">
                                <div class="modal-detail-title">设备 ${index + 1}: ${config.serial_number}</div>
                    <div class="modal-detail-content">
                                    <div style="color: #6c757d; padding: 20px; text-align: center;">该设备暂无云配置数据</div>
                    </div>
                </div>
                        `;
            }
            // 扁平化结构：每个模式一个独立的 modal-detail-section，用 border-left 颜色区分
            let result = '';
            if (config.desktop) {
                result += renderConfigDetail(config.desktop, 'desktop', config.serial_number, index + 1);
            }
            if (config.recovery) {
                result += renderConfigDetail(config.recovery, 'recovery', config.serial_number, index + 1);
            }
            return result;
        }).join('')}
            `;

        // 显示在模态窗口中
        document.getElementById('modalTitle').textContent = `云配置提取结果（已去重，${deviceMap.size}个设备）`;
        document.getElementById('modalContent').innerHTML = extractionHtml;
        document.getElementById('logModal').classList.add('show');
    }

    // 通用数据统计函数
    function analyzeData(dataKey, displayName) {
        if (allLogs.length === 0) {
            alert('请先加载日志数据');
            return;
        }

        // 按序列号和模式分组，去重处理
        const deviceMap = new Map(); // key: serial_number, value: { desktop: log, recovery: log }

        allLogs.forEach(log => {
            if (!log.logs || !log.logs.serial_number) return;

            const serial = log.logs.serial_number;
            const isDesktop = log.logs.os_type === true;
            const mode = isDesktop ? 'desktop' : 'recovery';

            if (!deviceMap.has(serial)) {
                deviceMap.set(serial, {desktop: null, recovery: null});
            }

            const device = deviceMap.get(serial);

            // 如果该模式下还没有数据，或者当前数据更新（时间更晚），则更新
            if (!device[mode] || new Date(log.timestamp) > new Date(device[mode].timestamp)) {
                device[mode] = log;
            }
        });

        // 统计数据项（按唯一设备统计，不区分模式）
        const itemCounts = {};
        let devicesWithData = 0;
        let totalUniqueDevices = deviceMap.size;

        deviceMap.forEach((device, serial) => {
            // 收集该设备所有模式下的数据（去重）
            const allItems = new Set();

            // 处理桌面模式
            if (device.desktop && device.desktop.logs && device.desktop.logs[dataKey]) {
                const items = device.desktop.logs[dataKey];
                if (Array.isArray(items) && items.length > 0) {
                    items.forEach(item => {
                        if (item) allItems.add(item);
                    });
                }
            }

            // 处理恢复模式
            if (device.recovery && device.recovery.logs && device.recovery.logs[dataKey]) {
                const items = device.recovery.logs[dataKey];
                if (Array.isArray(items) && items.length > 0) {
                    items.forEach(item => {
                        if (item) allItems.add(item);
                    });
                }
            }

            // 如果该设备有数据，统计每个数据项出现的次数
            if (allItems.size > 0) {
                devicesWithData++;
                allItems.forEach(item => {
                    itemCounts[item] = (itemCounts[item] || 0) + 1;
                });
            }
        });

        // 按出现次数排序
        const sortedItems = Object.entries(itemCounts)
            .sort((a, b) => b[1] - a[1])
            .map(([name, count]) => ({name, count}));

        // 生成分析结果HTML
        if (sortedItems.length === 0) {
            alert(`没有找到包含${displayName}的数据`);
            return;
        }

        const analysisHtml = `
                <div class="modal-detail-section" style="grid-column: 1 / -1;">
                    <div class="modal-detail-title">${displayName}分析总结</div>
                    <div class="modal-detail-content">
                        <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            <div><strong>唯一设备数（去重后）:</strong> ${totalUniqueDevices}</div>
                            <div><strong>总日志记录数:</strong> ${allLogs.length}</div>
                            <div><strong>包含${displayName}的设备:</strong> ${devicesWithData}</div>
                            <div><strong>唯一${displayName}总数:</strong> ${sortedItems.length}</div>
                        </div>
                        <div style="max-height: 75vh; overflow-y: auto;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="background: #f8f9fa; border-bottom: 2px solid #4facfe;">
                                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #4facfe;">${displayName}名称</th>
                                        <th style="padding: 12px; text-align: center; border-bottom: 2px solid #4facfe;">出现次数</th>
                                        <th style="padding: 12px; text-align: center; border-bottom: 2px solid #4facfe;">占比</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${sortedItems.map(item => {
            const percentage = devicesWithData > 0 ? ((item.count / devicesWithData) * 100).toFixed(2) : '0.00';
            return `
                                            <tr style="border-bottom: 1px solid #e9ecef;">
                                                <td style="padding: 10px; word-break: break-all;">${item.name}</td>
                                                <td style="padding: 10px; text-align: center; font-weight: bold; color: #4facfe;">${item.count}</td>
                                                <td style="padding: 10px; text-align: center;">${percentage}%</td>
                                            </tr>
                                        `;
        }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

        // 显示在模态窗口中
        document.getElementById('modalTitle').textContent = `${displayName}分析总结（已去重）`;
        document.getElementById('modalContent').innerHTML = analysisHtml;
        document.getElementById('logModal').classList.add('show');
    }

    // 系统版本统计功能
    function analyzeSystemVersion() {
        if (allLogs.length === 0) {
            alert('请先加载日志数据');
            return;
        }

        // 按序列号分组
        const deviceMap = new Map();

        allLogs.forEach(log => {
            if (!log.logs || !log.logs.serial_number) return;

            const serial = log.logs.serial_number;
            const isDesktop = log.logs.os_type === true;
            const mode = isDesktop ? 'desktop' : 'recovery';

            if (!deviceMap.has(serial)) {
                deviceMap.set(serial, {desktop: null, recovery: null});
            }

            const device = deviceMap.get(serial);

            // 如果该模式下还没有数据，或者当前数据更新（时间更晚），则更新
            if (!device[mode] || new Date(log.timestamp) > new Date(device[mode].timestamp)) {
                device[mode] = log;
            }
        });

        // 统计系统版本（按唯一设备统计，不区分模式）
        const versionCounts = {};
        let devicesWithVersion = 0;
        let totalUniqueDevices = deviceMap.size;
        const allVersions = new Set();

        deviceMap.forEach((device, serial) => {
            // 收集该设备所有模式下的系统版本（去重）
            const deviceVersions = new Set();

            // 处理桌面模式
            if (device.desktop && device.desktop.logs && device.desktop.logs.os_version) {
                const version = device.desktop.logs.os_version;
                deviceVersions.add(version);
                allVersions.add(version);
            }

            // 处理恢复模式
            if (device.recovery && device.recovery.logs && device.recovery.logs.os_version) {
                const version = device.recovery.logs.os_version;
                deviceVersions.add(version);
                allVersions.add(version);
            }

            // 如果该设备有系统版本，统计每个版本出现的次数
            if (deviceVersions.size > 0) {
                devicesWithVersion++;
                deviceVersions.forEach(version => {
                    versionCounts[version] = (versionCounts[version] || 0) + 1;
                });
            }
        });

        // 按出现次数排序
        const sortedVersions = Object.entries(versionCounts)
            .sort((a, b) => b[1] - a[1])
            .map(([version, count]) => ({version, count}));

                        </div>

                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="background: #f8f9fa; border-bottom: 2px solid #4facfe;">
                                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #4facfe;">系统版本</th>
