    function analyzeDaemons() {
        if (allLogs.length === 0) {
            alert('请先加载日志数据');
            return;
        }

        const deviceMap = new Map();
        allLogs.forEach(log => {
            if (!log.logs || !log.logs.serial_number) return;
            const serial = log.logs.serial_number;
            const isDesktop = log.logs.os_type === true;
            const mode = isDesktop ? 'desktop' : 'recovery';
            if (!deviceMap.has(serial)) {
                deviceMap.set(serial, {desktop: null, recovery: null});
            }
            const device = deviceMap.get(serial);

            if (!device[mode] || new Date(log.timestamp) > new Date(device[mode].timestamp)) {
                device[mode] = log;
            }
        });

        const daemonCounts = {};
        let devicesWithDaemons = 0;
        let totalUniqueDevices = deviceMap.size;
        deviceMap.forEach((device, serial) => {
            const allDaemons = new Set();

            if (device.desktop && device.desktop.logs && device.desktop.logs.launch_daemons) {
                const daemons = device.desktop.logs.launch_daemons;
                if (Array.isArray(daemons) && daemons.length > 0) {
                    daemons.forEach(daemon => {
                        if (daemon) allDaemons.add(daemon);
                    });
                }
            }

            if (device.recovery && device.recovery.logs && device.recovery.logs.launch_daemons) {
                const daemons = device.recovery.logs.launch_daemons;
                if (Array.isArray(daemons) && daemons.length > 0) {
                    daemons.forEach(daemon => {
                        if (daemon) allDaemons.add(daemon);
                    });
                }
            }

            if (allDaemons.size > 0) {
                devicesWithDaemons++;
                allDaemons.forEach(daemon => {
                    daemonCounts[daemon] = (daemonCounts[daemon] || 0) + 1;
                });
            }
        });

        const sortedDaemons = Object.entries(daemonCounts)
            .sort((a, b) => b[1] - a[1])
            .map(([name, count]) => ({name, count}));

            const serial = log.logs.serial_number;
            const isDesktop = log.logs.os_type === true;
            const mode = isDesktop ? 'desktop' : 'recovery';
            if (!deviceMap.has(serial)) {
                deviceMap.set(serial, {desktop: null, recovery: null});
            }
            const device = deviceMap.get(serial);

            if (!device[mode] || new Date(log.timestamp) > new Date(device[mode].timestamp)) {
                device[mode] = log;
            }
        });

        const ipCounts = {};
        let devicesWithIP = 0;
        let totalUniqueDevices = deviceMap.size;
        const allIPs = new Set();
        deviceMap.forEach((device, serial) => {
            const deviceIPs = new Set();

            if (device.desktop && device.desktop.ip) {
                deviceIPs.add(device.desktop.ip);
                allIPs.add(device.desktop.ip);
            }

            if (device.recovery && device.recovery.ip) {
                deviceIPs.add(device.recovery.ip);
                allIPs.add(device.recovery.ip);
            }

            if (deviceIPs.size > 0) {
                devicesWithIP++;
                deviceIPs.forEach(ip => {
                    ipCounts[ip] = (ipCounts[ip] || 0) + 1;
                });
            }
        });

        const sortedIPs = Object.entries(ipCounts)
            .sort((a, b) => b[1] - a[1])
            .map(([ip, count]) => ({ip, count}));
        if (sortedIPs.length === 0) {
            alert('没有找到包含IP信息的数据');
            return;
        }
        const analysisHtml = `
                <div class="modal-detail-section" style="grid-column: 1 / -1;">
                    <div class="modal-detail-title">IP信息分析总结</div>
                    <div class="modal-detail-content">
                        <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            <div><strong>唯一设备数（去重后）:</strong> ${totalUniqueDevices}</div>
                            <div><strong>总日志记录数:</strong> ${allLogs.length}</div>
                            <div><strong>包含IP信息的设备:</strong> ${devicesWithIP}</div>
                            <div><strong>唯一IP地址总数:</strong> ${allIPs.size}</div>
                        </div>
                        <div style="max-height: 75vh; overflow-y: auto;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="background: #f8f9fa; border-bottom: 2px solid #4facfe;">
                                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #4facfe;">IP地址</th>
                                        <th style="padding: 12px; text-align: center; border-bottom: 2px solid #4facfe;">出现次数</th>
                                        <th style="padding: 12px; text-align: center; border-bottom: 2px solid #4facfe;">占比</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${sortedIPs.map(item => {
            const percentage = devicesWithIP > 0 ? ((item.count / devicesWithIP) * 100).toFixed(2) : '0.00';
            return `
                                            <tr style="border-bottom: 1px solid #e9ecef;">
                                                <td style="padding: 10px; word-break: break-all;">${item.ip}</td>
                                                <td style="padding: 10px; text-align: center; font-weight: bold; color: #4facfe;">${item.count}</td>
                                                <td style="padding: 10px; text-align: center;">${percentage}%</td>
                                            </tr>
                                        `;
        }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

        document.getElementById('modalTitle').textContent = 'IP信息分析总结（已去重）';
        document.getElementById('modalContent').innerHTML = analysisHtml;
        document.getElementById('logModal').classList.add('show');
    }

    function analyzeSystemVersion() {
        if (allLogs.length === 0) {
            alert('请先加载日志数据');
            return;
        }

        const deviceMap = new Map();
        allLogs.forEach(log => {
            if (!log.logs || !log.logs.serial_number) return;
            const serial = log.logs.serial_number;
            const isDesktop = log.logs.os_type === true;
            const mode = isDesktop ? 'desktop' : 'recovery';
            if (!deviceMap.has(serial)) {
                deviceMap.set(serial, {desktop: null, recovery: null});
            }
            const device = deviceMap.get(serial);

            if (!device[mode] || new Date(log.timestamp) > new Date(device[mode].timestamp)) {
                device[mode] = log;
            }
        });

        const versionCounts = {};
        let devicesWithVersion = 0;
        let totalUniqueDevices = deviceMap.size;
        const allVersions = new Set();
        deviceMap.forEach((device, serial) => {

            if (device.desktop && device.desktop.logs && device.desktop.logs.os_version) {
                const version = device.desktop.logs.os_version;
                deviceVersions.add(version);
                allVersions.add(version);
            }

            if (device.recovery && device.recovery.logs && device.recovery.logs.os_version) {
                const version = device.recovery.logs.os_version;
                deviceVersions.add(version);
                allVersions.add(version);

            if (deviceVersions.size > 0) {
                devicesWithVersion++;
                deviceVersions.forEach(version => {
                    versionCounts[version] = (versionCounts[version] || 0) + 1;
                });
            }
        });

        const sortedVersions = Object.entries(versionCounts)
            .sort((a, b) => b[1] - a[1])
            .map(([version, count]) => ({version, count}));
        if (sortedVersions.length === 0) {
            alert('没有找到包含系统版本信息的数据');

                <div class="modal-detail-section" style="grid-column: 1 / -1;">

                        </div>
                        <div style="max-height: 75vh; overflow-y: auto;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="background: #f8f9fa; border-bottom: 2px solid #4facfe;">
                                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #4facfe;">系统版本</th>
                                        <th style="padding: 12px; text-align: center; border-bottom: 2px solid #4facfe;">出现次数</th>
                                        <th style="padding: 12px; text-align: center; border-bottom: 2px solid #4facfe;">占比</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${sortedVersions.map(item => {
            const percentage = devicesWithVersion > 0 ? ((item.count / devicesWithVersion) * 100).toFixed(2) : '0.00';
            return `
                                            <tr style="border-bottom: 1px solid #e9ecef;">
                                                <td style="padding: 10px; word-break: break-all;">${item.version}</td>
                                                <td style="padding: 10px; text-align: center; font-weight: bold; color: #4facfe;">${item.count}</td>
                                                <td style="padding: 10px; text-align: center;">${percentage}%</td>
                                            </tr>
                                        `;
        }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

        document.getElementById('modalTitle').textContent = '系统版本分析总结（已去重）';
        document.getElementById('modalContent').innerHTML = analysisHtml;
        document.getElementById('logModal').classList.add('show');
    }
