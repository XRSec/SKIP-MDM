<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title class="title">MDM 权限验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            /* Safari 移动端兼容性：使用 dvh 作为备用方案 */
            min-height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* 背景装饰圆圈 */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }

        body::before {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
        }

        body::after {
            width: 400px;
            height: 400px;
            bottom: -200px;
            right: -200px;
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-50px) rotate(180deg);
            }
        }

        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100%;
            max-width: 480px;
            transform: translate(-50%, -50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            animation: fadeIn 0.6s ease-out;
            overflow: hidden;
            /* 优化的过渡效果 */
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                padding 0.35s ease-out,
                border-radius 0.35s ease-out,
                left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                max-height 0.35s ease-out;
        }

        .container.collapsed {
            left: 20px;
            top: 50%;
            transform: translate(0, -50%);
            width: 50px;
            height: 50px;
            max-width: 50px;
            max-height: 50px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            overflow: hidden;
            /* 收起时的过渡 - 更快更有弹性 */
            transition: width 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                height 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                padding 0.3s ease-out,
                border-radius 0.3s ease-out,
                left 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                transform 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                max-height 0.3s ease-out;
        }

        /* 收起时隐藏内容 */
        .container.collapsed #menu,
        .container.collapsed form,
        .container.collapsed .code {
            display: none !important;
        }

        .container.collapsed #collapse-button {
            position: static !important;
            margin: 0 !important;
            width: 40px !important;
            height: 40px !important;
            font-size: 20px !important;
            background: rgba(255, 255, 255, 0.3) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            backdrop-filter: blur(15px) !important;
            top: auto !important;
            right: auto !important;
        }

        .container.collapsed #collapse-button:hover {
            background: rgba(255, 255, 255, 0.4) !important;
            transform: scale(1.05) !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        #menu {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px;
            margin-bottom: 30px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #menu ul {
            list-style: none;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            gap: 8px;
        }

        #menu li {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            border-radius: 14px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        #menu li::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
            opacity: 0;
            transition: opacity 0.3s;
        }

        #menu li:hover::before {
            opacity: 1;
        }

        #menu li.active {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.2));
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        form {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        label {
            display: block;
            color: white;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        input[type="submit"]::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        input[type="submit"]:hover::before {
            width: 300px;
            height: 300px;
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
        }

        input[type="submit"]:active {
            transform: translateY(-1px);
        }

        .code {
            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 16px;
            border-radius: 14px;
            margin-top: 25px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        code {
            font-family: 'Monaco', 'Consolas', monospace;
            color: white;
            font-size: 13px;
            line-height: 1.6;
            display: block;
            word-break: break-all;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        button {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        #toggle-button {
            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #toggle-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        #collapse-button {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 10;
            /* 禁用长按右键菜单 */
            -webkit-touch-callout: none;
            /* iOS Safari */
            -webkit-user-select: none;
            /* Safari */
            -khtml-user-select: none;
            /* Konqueror HTML */
            -moz-user-select: none;
            /* Old versions of Firefox */
            -ms-user-select: none;
            /* Internet Explorer/Edge */
            user-select: none;
            /* Non-prefixed version */
            /* 禁用长按事件 */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            /* 防止双击缩放和长按菜单 */
        }

        #collapse-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        #collapse-button:active {
            transform: scale(0.95);
        }


        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            z-index: 9999;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #navbar {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            padding: 0;
            border-radius: 20px;
            max-width: 300px;
            max-height: 70vh;
            max-height: 70dvh;
            /* Dynamic viewport height for Safari */
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 999;
        }

        #navbar-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #navbar-content {
            padding: 20px;
            max-height: calc(70vh - 60px);
            max-height: calc(70dvh - 60px);
            /* Dynamic viewport height for Safari */
            overflow-y: auto;
        }

        #navbar::-webkit-scrollbar {
            width: 6px;
        }

        #navbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        #navbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }

        #navbar-content a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        #navbar-content a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        #content {
            position: fixed;
            top: calc(50% - 40px);
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            padding: 30px;
            background: rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            max-width: 1200px;
            width: 90%;
            max-height: calc(100vh - 150px);
            max-height: calc(100dvh - 150px);
            /* Dynamic viewport height for Safari */
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            color: white;
            display: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #content.showDoc {
            display: block;
        }

        .container.collapsed~#content {
            transform: translate(-50%, -50%);
        }

        .container.collapsed {
            z-index: 200;
        }

        #content h1,
        #content h2,
        #content h3,
        #content h4,
        #content h5,
        #content h6 {
            color: white;
            margin: 30px 0 20px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            font-weight: 700;
            position: relative;
        }

        #content h1 {
            font-size: 2.2em;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        #content h2 {
            font-size: 1.8em;
            border-left: 4px solid rgba(255, 255, 255, 0.5);
            padding-left: 15px;
        }

        #content h3 {
            font-size: 1.4em;
            color: rgba(255, 255, 255, 0.9);
        }

        #content p {
            line-height: 1.8;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        #content img {
            max-width: 100%;
            /*width: 90%;*/
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        #content img:hover {
            transform: scale(1.02);
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            /* background: rgba(0, 0, 0, 0.3); */
            /* backdrop-filter: blur(10px); */
            padding: 15px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            z-index: 100;
            /* border-top: 1px solid rgba(255, 255, 255, 0.1); */
        }

        .footer a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: white;
            text-decoration: underline;
        }

        .flash-border {
            animation: flash-border 0.5s infinite alternate;
            background: linear-gradient(90deg, gold, orange);
            padding: 3px;
            border-radius: 15px;
            margin: 15px 0;
        }

        @keyframes flash-border {
            0% {
                opacity: 0.8;
            }

            100% {
                opacity: 0.3;
            }
        }

        iframe {
            width: 100%;
            height: 400px;
            border-radius: 15px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Marked 内容美化 */
        #content pre {
            background: rgba(0, 0, 0, 0.4);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            overflow-x: auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        #content code {
            background: rgba(255, 255, 255, 0.1);
            color: #f8f8f2;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Monaco', 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #content pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: #f8f8f2;
            font-size: 14px;
            line-height: 1.6;
        }

        #content blockquote {
            border-left: 4px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            margin: 20px 0;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: rgba(255, 255, 255, 0.8);
        }

        #content ul,
        #content ol {
            margin: 20px 0;
            padding-left: 30px;
            color: rgba(255, 255, 255, 0.9);
        }

        #content li {
            margin: 8px 0;
            line-height: 1.6;
        }

        #content ul li {
            list-style-type: none;
            position: relative;
        }

        #content ul li::before {
            content: "•";
            color: rgba(255, 255, 255, 0.6);
            font-weight: bold;
            position: absolute;
            left: -20px;
        }

        #content ol li {
            list-style-type: decimal;
            color: rgba(255, 255, 255, 0.9);
        }

        #content a {
            color: #4facfe;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
            padding: 2px 4px;
            border-radius: 4px;
        }

        #content a:hover {
            color: #00f2fe;
            background: rgba(79, 172, 254, 0.1);
            border-bottom-color: #4facfe;
        }

        #content strong {
            color: white;
            font-weight: 700;
        }

        #content em {
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
        }

        #content hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            margin: 30px 0;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #content th,
        #content td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #content th {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: 600;
        }

        #content td {
            color: rgba(255, 255, 255, 0.9);
        }

        #content tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        #content details {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            margin: 15px 0;
            overflow: hidden;
        }

        #content summary {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        #content summary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #content details[open] summary {
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        #content details>*:not(summary) {
            padding: 15px 20px;
            color: rgba(255, 255, 255, 0.9);
        }

        @media screen and (max-width: 768px) {
            .container {
                padding: 35px;
                border-radius: 35px;
                max-height: 485px;
            }

            .container.collapsed {
                left: 10px;
                width: 45px;
                height: 45px;
                max-width: 45px;
                max-height: 45px;
                padding: 0;
            }

            #menu li {
                padding: 10px;
                font-size: 13px;
            }

            #navbar {
                max-width: 200px;
                right: 10px;
                top: 10px;
            }

            #navbar-header {
                padding: 12px 15px;
            }

            #navbar-content {
                padding: 15px;
                max-height: calc(70vh - 50px);
                max-height: calc(70dvh - 50px);
                /* Dynamic viewport height for Safari */
            }

            #toggle-button {
                padding: 6px 12px;
                font-size: 12px;
            }

            #content {
                padding: 10px;
                width: 95%;
                max-height: calc(100vh - 120px);
                max-height: calc(100dvh - 120px);
                /* Dynamic viewport height for Safari */
                top: calc(50% - 40px);
            }

            .container.collapsed~#content {
                left: 50%;
                transform: translate(-50%, -50%);
                width: 95%;
            }

            .container.collapsed {
                z-index: 200;
            }

            #toggle-button {
                top: 10px;
                right: 10px;
                padding: 8px 15px;
                font-size: 12px;
            }

            #collapse-button {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }

            #content details>*:not(summary) {
                padding: 10px;
            }

            .container.collapsed #collapse-button {
                width: 35px !important;
                height: 35px !important;
                font-size: 18px !important;
            }
        }
    </style>
    <script>
        let dictionary = {
            "zh-CN": {
                "title": "MDM 权限验证",
                "auth": "验证权限",
                "add": "添加授权",
                "language": "English",
                "serial_number": "Mac 序列号: ",
                "submit": "提交",
                "card_id": "卡密卡号: ",
                "password": "卡密密码: ",
                "copyText": "点击复制",
                "add_success": "序列号添加授权成功!",
                "sn_no_pair": "序列号长度必须在8-14位之间！",
                "pass_no_pair": "密码长度为15位！",
                "card_no_pair": "卡号长度必须在5-10位之间！",
                "auth_error": "验证失败，请确认您有权限！",
                "create_error": "创建授权失败，请联系管理员！",
                "card_used": "卡密已被使用",
                "net_error": "网络连接超时!",
                "time_error": "临时权限，使用权限超过一天!",
                "auth_ok": "验证成功！",
                "copy_ok": "复制成功: ",
                "get_root_domain_err": "无法提取根域名, 使用默认服务器地址",
                "get_doc_error": "获取文档失败",
                "show": "展开",
                "hide": "收起",
                "placeholder_sn": "请输入 Mac 序列号",
                "placeholder_card_id": "请输入卡密卡号",
                "placeholder_password": "请输入卡密密码",

            },
            "en": {
                "title": "MDM Auth Manage",
                "auth": "Verify Auth",
                "add": "Add Auth",
                "language": "中文",
                "serial_number": "Mac Serial Number: ",
                "submit": "Submit",
                "card_id": "Card ID: ",
                "password": "Password: ",
                "copyText": "Copy",
                "add_success": "Serial number added authorization successfully!",
                "sn_no_pair": "Serial number length must be between 8-14 digits！",
                "pass_no_pair": "Password length is 15 digits！",
                "card_no_pair": "Card number length must be between 5-10 digits！",
                "auth_error": "Authentication failed, please make sure you have permission!",
                "create_error": "Failed to create authorization, please contact administrator！",
                "card_used": "Card has been used",
                "net_error": "Network connection timeout!",
                "time_error": "Temporary permissions, use permissions for more than one day!",
                "auth_ok": "Authentication succeeded!",
                "copy_ok": "Copy Success: ",
                "get_root_domain_err": "Unable to extract root domain name, using default server address",
                "get_doc_error": "获取文档失败",
                "show": "Show",
                "hide": "Hide",
                "placeholder_sn": "Please enter Mac serial number",
                "placeholder_card_id": "Please enter card ID",
                "placeholder_password": "Please enter card password",
            }
        };
        let navbarStatus = true
        let containerCollapsed = false

        // 图片缓存管理 - 使用固定缓存键
        const imageCache = new Map();

        // 生成固定的缓存键，避免参数变化影响缓存
        function getCacheKey(url) {
            // 移除所有查询参数，使用基础URL作为缓存键
            const baseUrl = url.split('?')[0];
            return baseUrl;
        }

        // 带缓存的图片预加载
        function preloadImage(src) {
            const cacheKey = getCacheKey(src);

            return new Promise((resolve, reject) => {
                // 检查内存缓存
                if (imageCache.has(cacheKey)) {
                    resolve(imageCache.get(cacheKey));
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    // 存储到内存缓存
                    imageCache.set(cacheKey, img);
                    resolve(img);
                };
                img.onerror = reject;
                img.src = src;
            });
        }

        // 批量预加载图片
        function preloadAllImages() {
            const images = document.querySelectorAll('img');
            const loadPromises = [];

            images.forEach(img => {
                const originalSrc = img.src;
                const thumbnailSrc = originalSrc.includes('?fmt=webp&q=48&w=500')
                    ? originalSrc
                    : originalSrc + '?fmt=webp&q=48&w=500';
                const fullSizeSrc = originalSrc.replace('?fmt=webp&q=48&w=500', '');

                // 预加载缩略图和原图
                loadPromises.push(
                    preloadImage(thumbnailSrc),
                    preloadImage(fullSizeSrc)
                );
            });

            return Promise.allSettled(loadPromises);
        }


        // 全局调试函数
        window.imageCache = {
            preload: preloadAllImages,
            cache: imageCache
        };

        function toggleContainer() {
            const container = document.querySelector('.container');
            const collapseButton = document.getElementById('collapse-button');

            containerCollapsed = !containerCollapsed;

            if (containerCollapsed) {
                // 收起：直接添加 collapsed 类
                container.classList.add('collapsed');
                collapseButton.textContent = '+';
            } else {
                // 展开：设置临时高度限制实现平滑过渡
                container.style.maxHeight = '50px';
                container.classList.remove('collapsed');
                collapseButton.textContent = '−';
                // 稍后移除高度限制，让容器展开到自然高度
                setTimeout(() => {
                    container.style.removeProperty('max-height');
                }, 100);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            let menuItems = document.querySelectorAll('#menu li');
            let forms = document.querySelectorAll('form');

            function hideLoadingSpinner() {
                const container = document.getElementById('loading-container');
                container.style.display = 'none';
                document.body.style.overflow = 'auto'; // 启用滚动
                document.querySelectorAll('button, input, select').forEach(el => el.disabled = false); // 启用其他交互元素
            }

            // 为所有图片添加点击事件处理程序
            function addImageClickListeners() {
                document.querySelectorAll('img').forEach(image => {
                    // 为每个图片添加缓存标识
                    if (!image.dataset.originalSrc) {
                        image.dataset.originalSrc = image.src.includes('?fmt=webp&q=48&w=500')
                            ? image.src.replace('?fmt=webp&q=48&w=500', '')
                            : image.src;
                        image.dataset.thumbnailSrc = image.src.includes('?fmt=webp&q=48&w=500')
                            ? image.src
                            : image.src + '?fmt=webp&q=48&w=500';
                    }

                    image.addEventListener('click', function toggleImageSize() {
                        const image = event.target;
                        const currentSrc = image.src;
                        const isThumbnail = currentSrc.includes('?fmt=webp&q=48&w=500');

                        // 使用缓存切换图片
                        if (isThumbnail) {
                            // 切换到原图
                            const targetSrc = image.dataset.originalSrc;
                            const cacheKey = getCacheKey(targetSrc);

                            if (imageCache.has(cacheKey)) {
                                // 从缓存获取
                                image.src = targetSrc;
                            } else {
                                // 预加载并缓存
                                preloadImage(targetSrc).then(() => {
                                    image.src = targetSrc;
                                });
                            }
                        } else {
                            // 切换到缩略图
                            const targetSrc = image.dataset.thumbnailSrc;
                            const cacheKey = getCacheKey(targetSrc);

                            if (imageCache.has(cacheKey)) {
                                // 从缓存获取
                                image.src = targetSrc;
                            } else {
                                // 预加载并缓存
                                preloadImage(targetSrc).then(() => {
                                    image.src = targetSrc;
                                });
                            }
                        }

                        let windowWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;

                        if (windowWidth < 900) {
                            window.open(image.src, '_blank'); // 将 URL 替换为您要打开的网址
                        }
                    });
                });
            }

            toggleLanguage()
            // 默认显示第一个表单
            forms[0].style.display = 'block';

            // 初始化 placeholder 文本
            document.querySelectorAll('.placeholder_sn').forEach(el => {
                el.placeholder = dictionary[document.documentElement.lang]["placeholder_sn"];
            });
            document.querySelectorAll('.placeholder_card_id').forEach(el => {
                el.placeholder = dictionary[document.documentElement.lang]["placeholder_card_id"];
            });
            document.querySelectorAll('.placeholder_password').forEach(el => {
                el.placeholder = dictionary[document.documentElement.lang]["placeholder_password"];
            });

            document.getElementById("copyText").innerText = `bash <(curl -kfsSL ${window.location.host}) -s`

            // 切换菜单
            document.getElementById('menu').addEventListener('click', function (event) {
                const clickedItem = event.target;
                // 确保点击的是菜单项
                if (clickedItem.classList.contains('menu-item') && !clickedItem.classList.contains('language')) {
                    menuItems.forEach(item => item.classList.remove('active')); // 移除所有菜单项的激活状态
                    clickedItem.classList.add('active'); // 激活当前菜单项
                    forms.forEach(form => form.style.display = 'none'); // 隐藏所有表单
                    forms[Array.from(menuItems).indexOf(clickedItem)].style.display = 'block'; // 显示对应的表单
                }
            });

            // 授权验证
            document.querySelector('#form1').addEventListener('submit', function (e) {
                e.preventDefault();
                handleAuthSubmit('#serial_number', '/auth');
            });

            document.querySelector('#form2').addEventListener('submit', function (e) {
                e.preventDefault();
                handleAuthSubmit('#serial_number1', '/add', {
                    card_id: document.querySelector('#card_id').value,
                    password: document.querySelector('#password').value
                });
            });

            function handleAuthSubmit(serialNumberSelector, endpoint, extraParams = {}) {
                (function showLoadingSpinner() {
                    const container = document.getElementById('loading-container');
                    container.style.display = 'flex';
                    document.body.style.overflow = 'hidden'; // 禁用滚动
                    document.querySelectorAll('button, input, select').forEach(el => el.disabled = true); // 禁用其他交互元素
                })()

                const serialNumber = document.querySelector(serialNumberSelector).value;

                (function validateSerialNumber() {
                    if (serialNumber.length < 8 || serialNumber.length > 14) {
                        alert(dictionary[document.documentElement.lang]["sn_no_pair"]);
                        return false;
                    } else {
                        hideLoadingSpinner();
                    }
                })()

                const url = (function buildUrl(endpoint, params) {
                    const queryString = Object.keys(params).map(key => `${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`).join('&');
                    return `http://${window.location.host}${endpoint}?${queryString}`;
                })(endpoint, { serial_number: serialNumber, ...extraParams })

                fetch(url).then(response => response.json()).then(response => {
                    if (response?.code === 200) {
                        alert(dictionary[document.documentElement.lang]["auth_ok"]);
                        // 在这里加载 marked.js
                        const marked_script = document.createElement("script");
                        marked_script.src = "/marked.min.js";
                        marked_script.setAttribute("cache-control", "max-age=604800");
                        document.body.appendChild(marked_script);

                        (function showDocs(doc) {
                            document.getElementById('content').innerHTML = marked.parse(doc);
                            addImageClickListeners();

                            // 设置标题 ID（不切换 navbar 状态）
                            setHeadingIds();
                            toggleNavbar()

                            // 显示内容
                            document.getElementById('content').classList.add('showDoc');

                            // 预加载所有图片（依赖 HTTP Cache-Control）
                            preloadAllImages().then(() => {
                                console.log('✅ 图片预加载完成，依赖 HTTP 缓存');
                            }).catch((error) => {
                                console.log('⚠️ 图片预加载失败:', error);
                            });

                            // 延迟收起表单，让内容先显示
                            setTimeout(() => {
                                if (!containerCollapsed) {
                                    toggleContainer();
                                }
                            }, 300);

                            // 添加点击事件监听器
                            document.querySelectorAll('.navbar-link').forEach(link => {
                                link.addEventListener('click', function () {
                                    // 平滑滚动到目标元素
                                    const targetId = this.getAttribute('href');
                                    const targetElement = document.querySelector(targetId);
                                    if (targetElement) {
                                        targetElement.scrollIntoView({ behavior: 'smooth' });
                                    }
                                });
                            });
                            // 自动滚动到温馨提示
                            setTimeout(() => {
                                document.querySelector('#heading-8')?.scrollIntoView({
                                    behavior: "smooth",
                                    block: "start"
                                });
                            }, 1000);
                            setTimeout(() => {
                                document.querySelectorAll('p > img').forEach((img) => {
                                    if (img.alt?.includes("须知")) {
                                        img.parentElement.classList.add('flash-border'); // 为每个 img 添加类
                                        img.style.borderRadius = 15
                                    }
                                });
                            }, 2500);
                            setTimeout(() => {
                                document.querySelectorAll('p > img').forEach((img) => {
                                    if (img.alt?.includes("须知")) {
                                        img.parentElement.classList.remove('flash-border'); // 为每个 img 添加类
                                        img.style.borderRadius = "unset"
                                    }
                                });
                            }, 5500);
                        })(response.doc.replaceAll("服务器地址", window.location.host) || dictionary[document.documentElement.lang]["get_doc_error"]);
                    } else {
                        alert(dictionary[document.documentElement.lang][response?.msg || "error"]);
                    }
                    hideLoadingSpinner();
                }).catch(() => {
                    alert(dictionary[document.documentElement.lang]["net_error"]);
                    hideLoadingSpinner();
                });
            }

            // 从粘贴板获取卡密
            let lastClipboardContent = ''; // 用于存储上次剪贴板内容
            let lastExecutionTime = 0; // 用于存储上次执行时间

            // 函数用于读取剪贴板内容
            async function readClipboard() {
                const now = Date.now(); // 获取当前时间
                if (now - lastExecutionTime < 5000) return; // 检查距离上次执行的时间
                lastExecutionTime = now; // 更新上次执行时间

                // 读取剪贴板文本 TODO 支持HTTPS
                if (!navigator.clipboard) {
                    console.error('无法读取剪贴板内容: 非HTTPS');
                    return
                }

                let text = await navigator.clipboard?.readText();
                // 仅在剪贴板内容更新时执行逻辑
                if (text !== lastClipboardContent) {
                    lastClipboardContent = text; // 更新存储的剪贴板内容
                    console.log("剪贴板内容已更新。");
                    const cardInfoRegex = /卡号:\s([a-zA-Z0-9]{6})\n密码:\s([a-zA-Z0-9]{15})/; // 正则表达式匹配卡号和密码
                    const match = text.match(cardInfoRegex);

                    if (match) {
                        console.log("检测到卡密并自动填充");
                        const cardNumber = match[1];  // 提取的卡号
                        const password = match[2];    // 提取的密码
                        menuItems[1].click(); // 模拟点击菜单项以显示表单 2
                        document.getElementById('card_id').value = cardNumber; // 更新表单字段
                        document.getElementById('password').value = password;
                        document.getElementById('serial_number1').focus(); // 聚焦到指定输入框
                    }
                }
            }

            // 添加点击和触摸事件监听
            document.addEventListener('click', readClipboard);
            document.addEventListener('touchstart', (event) => {
                // 防止多次触发 click 事件
                event.preventDefault();
                readClipboard();
            });

            // 加载 marked.js
            const marked_script = document.createElement("script");
            marked_script.src = "/marked.min.js";
            marked_script.setAttribute("cache-control", "max-age=604800");
            document.body.appendChild(marked_script);
        });


        // 处理 URL 参数
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const qValue = params.get('q');

            if (qValue) {
                document.querySelector('#serial_number').value = qValue;
                document.querySelector('#form1').requestSubmit();
            }
        });

        function copyText() {
            const text = document.getElementById("copyText").innerText; // 获取要复制的文本
            const tempInput = document.createElement("input"); // 创建一个临时输入框元素
            tempInput.type = "text";
            tempInput.value = text;
            document.body.appendChild(tempInput); // 将临时输入框元素添加到页面中
            tempInput.select(); // 选中临时输入框中的文本
            document.execCommand("copy"); // 执行复制命令
            document.body.removeChild(tempInput); // 移除临时输入框元素
            alert(`${dictionary[document.documentElement.lang]["copy_ok"]} ${text}`);
            // window.open('x-man-page://『 Command + T 打开新窗口 』', '_blank');
        }

        function toggleLanguage() {
            const language = document.documentElement.lang;
            const button = document.querySelector(".language");
            const submitButtons = document.querySelectorAll(".submit");

            const langDict = dictionary[language];
            const newLang = language === "zh-CN" ? "en" : "zh-CN";
            document.documentElement.lang = newLang;

            // 更新语言内容
            for (const key in langDict) {
                const elements = document.getElementsByClassName(key);
                for (const element of elements) {
                    element.innerHTML = dictionary[newLang][key];
                }
            }

            // 更新 placeholder 文本
            document.querySelectorAll('.placeholder_sn').forEach(el => {
                el.placeholder = dictionary[newLang]["placeholder_sn"];
            });
            document.querySelectorAll('.placeholder_card_id').forEach(el => {
                el.placeholder = dictionary[newLang]["placeholder_card_id"];
            });
            document.querySelectorAll('.placeholder_password').forEach(el => {
                el.placeholder = dictionary[newLang]["placeholder_password"];
            });

            button.textContent = newLang === "en" ? "中文" : "English";
            // 修改提交按钮文本
            submitButtons.forEach(btn => btn.value = newLang === "en" ? "Submit" : "提交");
        }

        // 设置标题 ID（独立函数，不依赖导航栏状态）
        function setHeadingIds() {
            let content = document.getElementById('content');
            Array.from(content.querySelectorAll('h1, h2, h3')).forEach((heading, index) => {
                heading.id = `heading-${index}`;
            });
        }

        // 生成导航栏内容
        function generateNavbarContent() {
            let content = document.getElementById('content');
            let navbarContent = document.getElementById('navbar-content');

            navbarContent.innerHTML = '';
            Array.from(content.querySelectorAll('h1, h2, h3')).forEach((heading, index) => {
                const level = parseInt(heading.tagName[1], 10);
                const anchorId = `heading-${index}`;
                navbarContent.innerHTML += `<a href="#${anchorId}" style="margin-left: ${level * 20}px;" class="navbar-link">${heading.textContent}</a>`;
            });
        }

        // 切换导航栏显示状态
        function toggleNavbar() {
            navbarStatus = !navbarStatus;
            let navbarContent = document.getElementById('navbar-content');
            let navbar = document.getElementById('navbar');

            // 更新按钮文本
            document.getElementById('toggle-button').innerHTML = navbarStatus ?
                dictionary[document.documentElement.lang]["hide"] :
                dictionary[document.documentElement.lang]["show"];

            // 显示/隐藏导航栏
            navbar.style.display = 'block';
            if (navbarStatus) {
                navbarContent.style.display = 'unset';
                generateNavbarContent(); // 生成导航内容
            } else {
                navbarContent.style.display = 'none';
                navbarContent.innerHTML = '';
            }
        }
    </script>
</head>
