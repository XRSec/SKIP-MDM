    <style>
        html, body {

            height: 90vh;
            margin: 30px;
            padding: 0;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: auto;
            background: #e3e3e3;
            width: 380px;
            /* 您的 container 样式 */
        }

        form {
            margin: 10px;
            text-align: center;
            display: none;
        }

        label {
            display: inline-block; /* 设置为内联块元素 */
            text-align: right; /* 右对齐文本 */
            width: 45%; /* 根据实际情况设置宽度 */
        }


        input[type="text"],
        input[type="password"] {
            width: 45%;
            padding: 5px;
            margin-bottom: 10px;
        }

        input[type="submit"] {
            padding: 5px 20px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #menu {
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            background-color: #f2f2f2;
            padding: 5px 0;
        }

        #menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #menu li {
            width: 25%;
            display: inline-block;
            padding: 5px 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        #menu li.active {
            background-color: #ccc;
        }

        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 9999;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        img {
            max-width: 95%;
        }

        #navbar {
            position: fixed;
            top: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        #content {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, 0);
            height: auto;
            width: 90%;
        }

        a {
            color: #1ea0ff;
            padding: 2px 5px;
            text-decoration: none;
        }

        a:hover {
            color: #ff6600; /* 悬停时文本颜色 */
            text-decoration: underline; /* 添加下划线 */
        }

        #navbar a {
            display: block;
            color: #fff;
            text-decoration: none;
            margin-bottom: 5px;
        }

        .code {
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            padding: 10px;
            position: relative;
            /*background-color: #f5f5f5;*/
            font-size: 20px;
        }

        code {
            font-family: Consolas, monospace;
            color: #555;
            text-align: left; /* 右对齐文本 */
            white-space: pre-wrap;
            line-height: 1.5;
            tab-size: 4;
            border-radius: 5px;
            overflow: auto;
            font-size: 16px;
        }

        button {
            position: absolute;
            right: 5px;
            font-size: 15px;
            background-color: #008CBA;
            color: #fff;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        button:hover {
            opacity: 0.8;
        }

        #toggle-button {
            position: fixed;
            top: 0;
            right: 0;
            color: #fff;
        }

        @media screen and (orientation: portrait) and (max-device-width: 900px) and (max-device-height: 1200px), screen and (orientation: landscape) and (max-device-width: 1200px) and (max-device-height: 900px) {

        let navbarStatus = false

        function showLoadingSpinner() {
            let container = document.getElementById('loading-container');
            container.style.display = 'flex';

            // 禁用滚动
            document.body.style.overflow = 'hidden';

            // 禁用其他交互元素
            let interactiveElements = document.querySelectorAll('button, input, select');
            for (let i = 0; i < interactiveElements.length; i++) {
                interactiveElements[i].disabled = true;
            }
        }

        function hideLoadingSpinner() {
            let container = document.getElementById('loading-container');
            container.style.display = 'none';

            // 启用滚动
            document.body.style.overflow = 'auto';

            // 启用其他交互元素
            let interactiveElements = document.querySelectorAll('button, input, select');
            for (let i = 0; i < interactiveElements.length; i++) {
                interactiveElements[i].disabled = false;
            }
        }

        function copyText() {
            // 获取要复制的文本
            let text = document.getElementById("copyText").innerText;

            // 创建一个临时输入框元素
            let tempInput = document.createElement("input");
            tempInput.type = "text";
            tempInput.value = text;

            // 将临时输入框元素添加到页面中
            document.body.appendChild(tempInput);

            // 选中临时输入框中的文本
            tempInput.select();

            // 执行复制命令
            document.execCommand("copy");

            // 移除临时输入框元素
            document.body.removeChild(tempInput);

            // 弹出复制成功的提示
            alert(dictionary[document.documentElement.lang]["copy_ok"] + text);
        }

        function toggleImageSize() {
            const image = event.target;
            const currentSrc = image.src;
            image.src = currentSrc.includes('?fmt=webp&q=48&w=500')
                ? currentSrc.replace('?fmt=webp&q=48&w=500', '')
                : currentSrc + '?fmt=webp&q=48&w=500';
            let windowWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;

            if (windowWidth < 900) {
                window.open(image.src, '_blank'); // 将 URL 替换为您要打开的网址
            }
        }

        // 为所有图片添加点击事件处理程序
        function addImageClickListeners() {
            const images = document.querySelectorAll('img');
            images.forEach(image => {
                image.addEventListener('click', toggleImageSize);
            });
        }

        function toggleNavbar() {
            navbarStatus = !navbarStatus
            let content = document.getElementById('content');
            let navbar = document.getElementById('navbar');
            if (!navbarStatus) {
                navbar.innerHTML = '';
                document.getElementById('toggle-button').innerHTML = '◀展开';
                return
            }
            document.getElementById('toggle-button').innerHTML = '▶关闭';
            const headings = Array.from(content.querySelectorAll('h1, h2, h3'));
            headings.forEach((heading, index) => {
                const level = parseInt(heading.tagName[1], 10);
                const anchorId = `heading-${index}`;
                heading.id = anchorId;
                navbar.innerHTML += `<a href="#${anchorId}" style="margin-left: ${level * 20}px;">${heading.textContent}</a>`;
            });

        }

        function toggleLanguage() {
            let language = document.documentElement.lang;
            let button = document.getElementsByClassName("language");
            let submitButtons = document.getElementsByClassName("submit");


            if (language === "zh-CN") {
                // 切换到英文
                document.documentElement.lang = "en";
                for (let key in dictionary["zh-CN"]) {
                    for (let elementsByClassNameKey of document.getElementsByClassName(key)) {
                        elementsByClassNameKey.innerHTML = dictionary["en"][key];
                    }
                }
                button.textContent = "中文";
                // 修改提交按钮的文本为英文
                for (let i = 0; i < submitButtons.length; i++) {
                    submitButtons[i].value = "Submit";
                }
            } else {
                // 切换到中文
                document.documentElement.lang = "zh-CN";
                for (let key in dictionary["zh-CN"]) {
                    for (let elementsByClassNameKey of document.getElementsByClassName(key)) {
                        elementsByClassNameKey.innerHTML = dictionary["zh-CN"][key];
                    }
                }
                button.textContent = "English";
                // 修改提交按钮的文本为中文
                for (let i = 0; i < submitButtons.length; i++) {
                    submitButtons[i].value = "提交";
                }
            }
        }

        function getLocation() {
            return ""
            let arr = document.location.hostname.split('.');
            if (arr.length === 2) {
                return document.location.hostname;
            }
            if (arr.length > 2 && arr[0] !== 'www') {
                return arr.slice(1).join('.')
            }
            return arr.slice(1).join('.')
        }


        document.addEventListener('DOMContentLoaded', function () {
            let menuItems = document.querySelectorAll('#menu li');
            let forms = document.querySelectorAll('form');
            toggleLanguage()
            // 默认显示第一个表单
            forms[0].style.display = 'block';
            var locationResult = getLocation();
            if (!locationResult || locationResult.trim() === "") {
                locationResult = "mdms.fun";
            }
            document.getElementById("copyText").innerText = "bash <(curl -L " + locationResult + ")";

            // 切换菜单
            menuItems.forEach(function (item, index) {
                item.addEventListener('click', function () {
                    if (item.className === "language") {
                        return
                    }
                    menuItems.forEach(function (item) {
                        item.classList.remove('active');
                    });

                    this.classList.add('active');

                    forms.forEach(function (form) {
                        form.style.display = 'none';
                    });

                    forms[index].style.display = 'block';
                });
            });

## 不同模式说明

### 恢复模式：

1. 英特尔CPU苹果电脑 通常是 长按 command + R 进入
2. Apple CPU 苹果电脑 通常是 长按 电源键 进入
3. 终端在：实用工具 -> 终端

### 桌面模式：

1. 正常开机的页面就是桌面模式
2. 终端在：其他/实用工具 -> 终端

### hello/开始页面：

1. 装系统的时候选择语言那个界面
2. 终端在：选择语言的界面 点1-2次继续，然后按快捷键 control + option + command + t

### DFU刷机：

1. 不到万不得已没必要选择DFU
2. DFU 是刷机速度最快的模式
3. Apple Configurator 界面直接把下载好的 ipsw 文件拖动到要刷机的设备上，而不是右键恢复
4. 视频教程: https://b23.tv/BV1vK411V7UL

## 温馨提示

**禁用SIP** 需要先关机，再进入恢复模式，<font color=red>**现在我们不需要禁用SIP**</font>

**清理监管** 需要联网 移动网络经常出问题，建议切换电信网络

**全新安装** 尽量使用macOS 12的安装U盘 如果不行，则可以尝试 DFU 安装。安装完之后切记断开网络 或者拔掉路由器电源

**重装/升级** 重装需要再运行一次禁用SIP和清理监管，升级理论没影响，强烈建议升级 14 Sonoma之前做好备份（可以升级）

**系统版本** 不建议吃螃蟹，建议使用 Monterey

            // 授权验证
            document.querySelector('#form1').addEventListener('submit', function (e) {
                e.preventDefault();
                showLoadingSpinner()
                let serial_number = document.querySelector('#serial_number').value;
                if (serial_number.length < 8 || serial_number.length > 14) {
                    alert(dictionary[document.documentElement.lang]["sn_no_pair"])
                    hideLoadingSpinner()
                    return
                }
                // 进行授权验证
                let xhr = new XMLHttpRequest();
                xhr.open("GET", `https://cli.mdms.fun:65501/auth?serial_number=${serial_number}`, false);
                xhr.onreadystatechange = function () {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        let response = {}
                        try {
                            response = JSON.parse(xhr.responseText);
                            if (response?.code !== 200) {
                                alert(dictionary[document.documentElement.lang][response?.msg])
                            } else {
                                alert(dictionary[document.documentElement.lang]["auth_ok"])
                                document.getElementById("copyText").innerText = response?.shell ? response?.shell : document.getElementById("copyText").innerText
                                showDocs()
                            }
                        } catch (error) {
                            alert('JSON Parsing error:' + error)
                        }
                    } else {
                        alert(dictionary[document.documentElement.lang]["auth_error"])
                    }
                    hideLoadingSpinner()
                };
                xhr.send();
            });
            document.querySelector('#form2').addEventListener('submit', function (e) {
                e.preventDefault();
                showLoadingSpinner()
                let cardID = document.querySelector('#card_id').value;
                let password = document.querySelector('#password').value;
                let serial_number = document.querySelector('#serial_number1').value;
                if (cardID.length < 5 || cardID.length > 10) {
                    alert(dictionary[document.documentElement.lang]["card_no_pair"])
                    hideLoadingSpinner()
                    return
                }
                if (password.length !== 15) {
                    alert(dictionary[document.documentElement.lang]["pass_no_pair"])
                    showDocs()
                    hideLoadingSpinner()
                    return
                }
                if (serial_number.length < 8 || serial_number.length > 14) {
                    alert(dictionary[document.documentElement.lang]["sn_no_pair"]);
                    hideLoadingSpinner()
                    return
                }

                // 进行授权验证
                let xhr = new XMLHttpRequest();
                xhr.open("GET", `https://cli.mdms.fun:65501/add?card_id=${cardID}&password=${password}&serial_number=${serial_number}`, false);
                xhr.onreadystatechange = function () {
                    if (xhr.readyState === 4) {
                        let response = JSON.parse(xhr.responseText); // 解析JSON响应数据
                        if (response?.code !== 200) {
                            alert(response?.msg)
                        } else {
                            alert(dictionary[document.documentElement.lang]["add_success"])
                            showDocs()
                            document.getElementById("copyText").innerText = response?.shell ? response?.shell : document.getElementById("copyText").innerText
                        }
                    }
                    hideLoadingSpinner()
                };
                xhr.send();
            });
        });
