<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title class="title">MDM Auth</title>
    <style>
        body {
            justify-content: center;
            align-items: center;
            height: 90vh;
            /*margin: 30px;*/
            padding: 0;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: auto;
            background: #e3e3e3;
            width: 380px;
            /* 您的 container 样式 */
        }

        form {
            margin: 10px;
            text-align: center;
            display: none;
        }

        label {
            display: inline-block; /* 设置为内联块元素 */
            text-align: right; /* 右对齐文本 */
            width: 45%; /* 根据实际情况设置宽度 */
        }


        input[type="text"],
        input[type="password"] {
            width: 45%;
            padding: 5px;
            margin-bottom: 10px;
        }

        input[type="submit"] {
            padding: 5px 20px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #menu {
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            background-color: #f2f2f2;
            padding: 5px 0;
        }

        #menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #menu li {
            width: 25%;
            display: inline-block;
            padding: 5px 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        #menu li.active {
            background-color: #ccc;
        }

        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 9999;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        img {
            max-width: 95%;
        }

        #navbar {
            position: fixed;
            top: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 4;
        }

        #content {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, 0);
            height: auto;
            width: 90%;
            z-index: 3;
        }

        a {
            color: #1ea0ff;
            padding: 2px 5px;
            text-decoration: none;
        }

        a:hover {
            color: #ff6600; /* 悬停时文本颜色 */
            text-decoration: underline; /* 添加下划线 */
        }

        #navbar a {
            display: block;
            color: #fff;
            text-decoration: none;
            margin-bottom: 5px;
        }

        .code {
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            padding: 10px;
            position: relative;
            /*background-color: #f5f5f5;*/
            font-size: 20px;
        }

        code {
            font-family: Consolas, monospace;
            color: #555;
            text-align: left; /* 右对齐文本 */
            white-space: pre-wrap;
            line-height: 1.5;
            tab-size: 4;
            border-radius: 5px;
            overflow: auto;
            font-size: 16px;
        }

        button {
            position: absolute;
            right: 5px;
            font-size: 15px;
            background-color: #008CBA;
            color: #fff;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        button:hover {
            opacity: 0.8;
        }

        #toggle-button {
            position: fixed;
            top: 0;
            right: 0;
            color: #fff;
            z-index: 4;
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            background-color: #f8f8f8;
            padding: 10px;
            border-top: 1px solid #ccc;
            font-size: 14px;
            color: #cb6b60;
        }

        @media screen and (orientation: portrait) and (max-device-width: 900px) and (max-device-height: 1200px), screen and (orientation: landscape) and (max-device-width: 1200px) and (max-device-height: 900px) {
            * {
                font-size: 15px;
            }

            body {
                height: 90vh;
                font-size: 35px;
                touch-action: manipulation;
                -webkit-user-select: none; /* Chrome, Safari, Opera */
                -moz-user-select: none; /* Firefox */
                -ms-user-select: none; /* IE/Edge */
                user-select: none; /* Non-prefixed version, currently supported by most modern browsers */
                padding: 0;
                margin: 0;
            }

            .container {
                width: 99%;
            }

            label {
                font-size: 16px;
            }

            input[type="text"] {
                font-size: 15px;
                width: 33%;
            }

            input[type="submit"] {
                padding: 5px 15px;
                font-size: 16px;
            }

            #menu li {
                font-size: 16px;
            }

            #content {
                width: 95%;
            }
        }

    </style>
    <script src="/index.js?pass=Dj6oXsEHPZ7ExJ"></script>
</head>
<body>
<div class="container">
    <div id="menu">
        <ul>
            <li class="active auth"></li>
            <li class="add"></li>
            <li class="language" onclick="toggleLanguage()"></li>
        </ul>
    </div>
    <form id="form1">
        <label class="serial_number" for="serial_number"></label>
        <input type="text" id="serial_number" name="serial_number"><br>
        <input class="submit" type="submit" value="">
    </form>
    <form id="form2">
        <label class="card_id" for="card_id"></label>
        <input type="text" id="card_id" name="card_id"><br>

        <label class="password" for="password"></label>
        <input type="text" id="password" name="password"><br>

        <label class="serial_number" for="serial_number1"></label>
        <input type="text" id="serial_number1" name="serial_number"><br>

        <input class="submit" type="submit" value="">
    </form>
    <div class="code">
        <code id="copyText"></code>
        <button class="copyText" onclick="copyText()"></button>
    </div>
</div>
<div id="loading-container" style="display: none;">
    <div class="loading-spinner"></div>
</div>
<div id="navbar"></div>
<div id="content"></div>
<button id="toggle-button" onclick="toggleNavbar()"></button>
<div class="footer">同行请勿攻击, 黑客大佬饶命, 警察请手下留情! <br>
    建站不容易,熬夜两行泪
</div>
</body>
</html>
