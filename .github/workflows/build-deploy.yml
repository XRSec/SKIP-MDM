name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  # ===============================
  # Build Linux server
  # ===============================
  build-linux-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21
          cache-dependency-path: server/go.sum
      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq gcc musl-dev

      - name: Build server
        run: |
          cd server
          export GOOS=linux GOARCH=amd64 CGO_ENABLED=1
          go build -o ../mdm-linux-amd64 -ldflags="-s -w -extldflags '-static' -X main.debug=false" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-server-amd64
          path: ./mdm-linux-amd64

  # ===============================
  # Build macOS agent (amd64 + arm64)
  # ===============================
  build-macos-agent:
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21
          cache-dependency-path: mdm/go.sum

      - name: Build macOS agent
        run: |
          cd mdm
          # 设置最低 macOS 版本
          export MACOSX_DEPLOYMENT_TARGET=10.13 GOOS=darwin GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 
          go build -o ../mdm-darwin-${{ matrix.goarch }} -ldflags="-s -w" .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-agent-${{ matrix.goarch }}
          path: ./mdm-darwin-${{ matrix.goarch }}

  # ===============================
  # Create Universal Binary (macOS)
  # ===============================
  create-universal-binary:
    if: false
    runs-on: macos-latest
    needs: build-macos-agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          path: src

      - name: Create Universal Binary
        run: |
          find $PWD/src -name "mdm-*-*" -exec cp -v {} src/ \;
          find $PWD/src -name "artifact-*" -type d -prune -exec rm -rf {} \;
          if [ -f src/mdm-darwin-amd64 ] && [ -f src/mdm-darwin-arm64 ]; then
            lipo -create src/mdm-darwin-amd64 src/mdm-darwin-arm64 -output src/mdm-darwin-universal
          fi

      - name: Upload Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-agent-universal
          path: src/mdm-darwin-universal

  # ===============================
  # Deploy job
  # ===============================
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-linux-server
      # - create-universal-binary
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: src

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq coreutils dos2unix
          npm install -g serverless-cloud-framework pkg
          git clone https://github.com/willshiao/node-bash-obfuscate.git
          cd node-bash-obfuscate && npm i && cd -
          pkg node-bash-obfuscate -t node16-linux-x64 -o src/bash-obfuscate
          rm -rf node-bash-obfuscate

      - name: Prepare scripts and binaries
        run: |
          find $PWD/src -name "mdm-*-*" -exec cp -v {} src/ \;
          find $PWD/src -name "artifact-*" -type d -prune      -exec rm -rf {} \;
          md5sum src/mdm-darwin-arm64 | cut -d ' ' -f1 >       src/mdm-darwin-arm64.md5
          md5sum src/mdm-darwin-amd64 | cut -d ' ' -f1 >       src/mdm-darwin-amd64.md5
          if [ -f src/mdm-darwin-universal ]; then
            md5sum src/mdm-darwin-universal | cut -d ' ' -f1 >   src/mdm-darwin-universal.md5
          fi

          src/bash-obfuscate shell/errorShell.sh  -o           html/errorShell.sh
          src/bash-obfuscate shell/unsafe1.sh     -o           html/unsafe1.sh
          cp -v shell/unsafe0.sh html/unsafe0.sh
          cp -v shell/cli.sh     html/cli.sh

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          aws s3 --endpoint-url ${{ secrets.AWS_ENDPOINT_URL }} cp src/mdm-darwin-amd64        s3://xrsec/MDM/mdm-darwin-amd64
          aws s3 --endpoint-url ${{ secrets.AWS_ENDPOINT_URL }} cp src/mdm-darwin-arm64        s3://xrsec/MDM/mdm-darwin-arm64
          if [ -f src/mdm-darwin-universal ]; then
            aws s3 --endpoint-url ${{ secrets.AWS_ENDPOINT_URL }} cp src/mdm-darwin-universal  s3://xrsec/MDM/mdm-darwin-universal
          fi

      - name: Run custom scripts & deploy
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          cd custom/sync && go run mysql2sqlite.go && cd -
          find "${PWD}" -name ".DS_Store" -exec rm -fv {} \;
          find "${PWD}" -type f -exec dos2unix -ic {} \; | xargs -I {} dos2unix '{}'
          cp -r server/doc.md server/server.db server/scf_bootstrap src 
          cp -r html src
          chmod +x src/scf_bootstrap src/mdm-*-*
          scf deploy

      - name: Send notification to Feishu
        uses: XRSec/feishu-bot-webhook-action@v1
        with:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_BOT_SIGNKEY: ${{ secrets.FEISHU_BOT_SIGNKEY }}
